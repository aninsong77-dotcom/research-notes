<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#4285f4">
<title>일일계획</title>
<link rel="manifest" href="manifest.json">
<style>
:root {
    --accent: #4285f4;
    --accent-dark: #1a73e8;
    --accent-light: #eaf1ff;
    --bg: #f1f3f4;
    --surface: #ffffff;
    --border: #dadce0;
    --text: #3c4043;
    --text-sub: #5f6368;
    --text-muted: #80868b;
    --danger: #d93025;
    --success: #1e8e3e;
    --warn: #f29900;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bot: env(safe-area-inset-bottom, 0px);
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

body {
    font-family: 'Apple SD Gothic Neo', 'Noto Sans KR', -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100dvh;
    overscroll-behavior: none;
}

/* ── 상단바 ── */
.topbar {
    position: sticky;
    top: 0;
    z-index: 100;
    background: var(--accent);
    color: white;
    padding: calc(var(--safe-top) + 10px) 16px 12px;
    display: flex;
    align-items: center;
    gap: 8px;
    box-shadow: 0 2px 8px rgba(66,133,244,.3);
}
.topbar-title { font-size: 18px; font-weight: 700; flex: 1; }
.btn-notif {
    background: rgba(255,255,255,.2);
    border: none;
    border-radius: 50%;
    width: 38px; height: 38px;
    color: white;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
}
.btn-notif:active { background: rgba(255,255,255,.35); }

/* ── 날짜 네비 ── */
.date-nav {
    background: var(--surface);
    padding: 14px 16px 10px;
    display: flex;
    align-items: center;
    gap: 8px;
    border-bottom: 1px solid var(--border);
}
.nav-btn {
    width: 40px; height: 40px;
    border: none;
    border-radius: 50%;
    background: var(--bg);
    font-size: 22px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    color: var(--text-sub);
    flex-shrink: 0;
}
.nav-btn:active { background: var(--border); }
.date-center { flex: 1; text-align: center; }
.date-weekday { font-size: 12px; color: var(--text-muted); }
.date-main { font-size: 17px; font-weight: 700; margin-top: 1px; display: flex; align-items: center; justify-content: center; gap: 6px; }
.today-chip {
    font-size: 10px; font-weight: 700;
    background: var(--accent); color: white;
    border-radius: 99px; padding: 2px 7px;
}
.btn-today {
    font-size: 12px; font-weight: 600;
    color: var(--accent);
    border: 1.5px solid var(--accent);
    background: var(--accent-light);
    border-radius: 20px;
    padding: 6px 12px;
    cursor: pointer;
    flex-shrink: 0;
}

/* ── 진행률 ── */
.progress-bar-wrap {
    background: var(--surface);
    padding: 10px 16px 14px;
    border-bottom: 1px solid var(--border);
    display: none;
}
.progress-bar-track {
    height: 6px; background: var(--border); border-radius: 99px; overflow: hidden;
}
.progress-bar-fill {
    height: 100%; background: var(--accent); border-radius: 99px;
    transition: width .3s ease;
}
.progress-text {
    font-size: 12px; color: var(--text-muted); margin-top: 5px; text-align: right;
}

/* ── 스크롤 영역 ── */
.scroll-area {
    padding: 12px 14px 200px;
    display: flex;
    flex-direction: column;
    gap: 8px;
}

/* ── 태스크 카드 ── */
.task-card {
    background: var(--surface);
    border-radius: 14px;
    padding: 14px 14px;
    display: flex;
    align-items: flex-start;
    gap: 12px;
    box-shadow: 0 1px 3px rgba(0,0,0,.07);
    transition: opacity .2s;
    position: relative;
}
.task-card.done { opacity: .5; }

.check-btn {
    width: 26px; height: 26px;
    border: 2.5px solid var(--border);
    border-radius: 50%;
    background: none;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    margin-top: 1px;
    color: transparent;
    transition: all .15s;
}
.check-btn:active { transform: scale(.88); }
.check-btn.checked { background: var(--accent); border-color: var(--accent); color: white; }

.task-body { flex: 1; min-width: 0; }
.task-title-inp {
    width: 100%;
    border: none; outline: none;
    font-size: 15px;
    font-family: inherit;
    color: var(--text);
    background: transparent;
    line-height: 1.4;
    padding: 0;
}
.task-title-inp:disabled { text-decoration: line-through; color: var(--text-muted); }

.task-meta {
    display: flex; align-items: center; flex-wrap: wrap; gap: 6px; margin-top: 6px;
}
.meta-chip {
    font-size: 11px; border-radius: 6px; padding: 2px 8px;
    display: flex; align-items: center; gap: 3px;
}
.chip-time { background: #e8f0fe; color: var(--accent); }
.chip-alarm { background: #fce8e6; color: var(--danger); }
.chip-prio-high { background: #fce8e6; color: var(--danger); }
.chip-prio-normal { background: #e8f0fe; color: var(--accent); }
.chip-prio-low { background: var(--bg); color: var(--text-muted); }

.btn-del-task {
    background: none; border: none;
    color: var(--text-muted); font-size: 18px;
    cursor: pointer; padding: 2px 4px;
    border-radius: 6px; flex-shrink: 0;
    opacity: 0;
    transition: opacity .15s;
    line-height: 1;
}
.task-card:active .btn-del-task,
.task-card.show-del .btn-del-task { opacity: 1; }

/* ── 완료 섹션 ── */
.done-header {
    display: flex; align-items: center; gap: 8px;
    padding: 4px 4px;
    cursor: pointer;
    color: var(--text-muted);
    font-size: 13px; font-weight: 600;
    user-select: none;
}
.done-arrow { font-size: 10px; transition: transform .2s; }
.done-arrow.open { transform: rotate(90deg); }
.done-list { display: none; flex-direction: column; gap: 8px; }
.done-list.open { display: flex; }

/* ── 빈 상태 ── */
.empty-state {
    text-align: center;
    padding: 48px 24px;
    color: var(--text-muted);
}
.empty-icon { font-size: 48px; margin-bottom: 12px; }
.empty-text { font-size: 15px; line-height: 1.8; }

/* ── 하단 고정 입력창 ── */
.bottom-bar {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    z-index: 200;
    background: var(--surface);
    border-top: 1px solid var(--border);
    padding: 12px 14px calc(var(--safe-bot) + 12px);
    box-shadow: 0 -4px 16px rgba(0,0,0,.08);
}

.add-row {
    display: flex;
    gap: 8px;
    align-items: center;
    margin-bottom: 8px;
}
.add-input {
    flex: 1;
    border: 1.5px solid var(--border);
    border-radius: 12px;
    padding: 11px 14px;
    font-size: 15px;
    font-family: inherit;
    color: var(--text);
    background: var(--bg);
    outline: none;
    transition: border-color .15s;
}
.add-input:focus { border-color: var(--accent); background: white; }
.add-input::-webkit-search-cancel-button { display: none; }
.add-input::-webkit-search-decoration { display: none; }

.btn-mic {
    width: 48px; height: 48px;
    border-radius: 50%;
    border: none;
    background: var(--accent);
    color: white;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    font-size: 22px;
    box-shadow: 0 2px 8px rgba(66,133,244,.4);
    transition: transform .15s, background .15s;
}
.btn-mic:active { transform: scale(.9); }
.btn-mic.listening {
    background: var(--danger);
    animation: pulse 1s infinite;
}
@keyframes pulse {
    0%,100% { box-shadow: 0 0 0 0 rgba(217,48,37,.4); }
    50% { box-shadow: 0 0 0 10px rgba(217,48,37,.0); }
}

.btn-add-text {
    width: 48px; height: 48px;
    border-radius: 50%;
    border: none;
    background: var(--accent);
    color: white;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    font-size: 24px;
    font-weight: 300;
    box-shadow: 0 2px 8px rgba(66,133,244,.4);
}
.btn-add-text:active { transform: scale(.9); }

.options-row {
    display: flex;
    gap: 6px;
    align-items: center;
}
.opt-input {
    border: 1.5px solid var(--border);
    border-radius: 10px;
    padding: 8px 10px;
    font-size: 13px;
    background: var(--bg);
    color: var(--text-sub);
    cursor: pointer;
    outline: none;
    font-family: inherit;
}
.opt-label { font-size: 12px; color: var(--text-muted); }

/* ── 음성 인식 오버레이 ── */
.voice-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.55);
    z-index: 500;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
}
.voice-overlay.active { display: flex; }
.voice-circle {
    width: 120px; height: 120px;
    border-radius: 50%;
    background: var(--danger);
    display: flex; align-items: center; justify-content: center;
    font-size: 48px;
    animation: pulse 1s infinite;
}
.voice-text { color: white; font-size: 17px; font-weight: 600; text-align: center; }
.voice-result { color: rgba(255,255,255,.8); font-size: 15px; min-height: 24px; padding: 0 32px; text-align: center; }
.btn-voice-cancel {
    background: rgba(255,255,255,.15);
    border: 1.5px solid rgba(255,255,255,.4);
    color: white;
    border-radius: 24px;
    padding: 10px 28px;
    font-size: 15px;
    cursor: pointer;
    margin-top: 8px;
}

/* ── 토스트 ── */
.toast {
    position: fixed;
    bottom: 90px; left: 50%; transform: translateX(-50%) translateY(20px);
    background: #3c4043;
    color: white;
    border-radius: 24px;
    padding: 10px 20px;
    font-size: 14px;
    z-index: 600;
    opacity: 0;
    transition: opacity .25s, transform .25s;
    white-space: nowrap;
    pointer-events: none;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ── 알림 설정 패널 ── */
.alarm-panel {
    display: none;
    background: var(--surface);
    border-radius: 16px;
    padding: 16px;
    margin: 8px 0 0;
    box-shadow: 0 2px 12px rgba(0,0,0,.1);
    gap: 10px;
    flex-wrap: wrap;
    align-items: center;
}
.alarm-panel.open { display: flex; }
.alarm-label { font-size: 13px; color: var(--text-sub); font-weight: 600; }
.alarm-opt {
    display: flex; align-items: center; gap: 6px;
    cursor: pointer; font-size: 13px; color: var(--text-sub);
}
.alarm-opt input[type=checkbox] { width: 16px; height: 16px; accent-color: var(--accent); cursor: pointer; }

/* ── 카테고리 탭 ── */
.cat-tabs {
    background: var(--surface);
    padding: 8px 12px;
    display: flex;
    gap: 6px;
    border-bottom: 1px solid var(--border);
    overflow-x: auto;
    scrollbar-width: none;
    -webkit-overflow-scrolling: touch;
}
.cat-tabs::-webkit-scrollbar { display: none; }
.cat-tab {
    border: none;
    border-radius: 20px;
    padding: 6px 14px;
    font-size: 13px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    white-space: nowrap;
    background: var(--bg);
    color: var(--text-sub);
    flex-shrink: 0;
    transition: background .15s, color .15s;
}
.cat-tab.active                    { color: white; }
.cat-tab.active[data-cat="all"]    { background: var(--accent); }
.cat-tab.active[data-cat="school"] { background: #4285f4; }
.cat-tab.active[data-cat="manage"] { background: #f29900; }
.cat-tab.active[data-cat="home"]   { background: #1e8e3e; }
.cat-tab.active[data-cat="other"]  { background: #80868b; }
/* 카테고리 칩 */
.chip-cat { font-weight: 600; }
.chip-cat-school { background: #e8f0fe; color: #4285f4; }
.chip-cat-manage { background: #fef3e2; color: #c77800; }
.chip-cat-home   { background: #e6f4ea; color: #1e8e3e; }
.chip-cat-other  { background: #f1f3f4; color: #80868b; }
/* options-row 스크롤 */
.options-row {
    overflow-x: auto;
    scrollbar-width: none;
    -webkit-overflow-scrolling: touch;
}
.options-row::-webkit-scrollbar { display: none; }
</style>
</head>
<body>

<!-- 상단바 -->
<div class="topbar">
    <div class="topbar-title"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;margin-right:6px"><path d="M8 2v4"/><path d="M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/><path d="m9 16 2 2 4-4"/></svg>일일계획</div>
    <button class="btn-notif" id="btn-notif-perm" title="알림 허용"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg></button>
</div>

<!-- 날짜 네비 -->
<div class="date-nav">
    <button class="nav-btn" id="btn-prev">&#8249;</button>
    <div class="date-center">
        <div class="date-weekday" id="date-weekday"></div>
        <div class="date-main">
            <span id="date-main-text"></span>
            <span class="today-chip" id="today-chip" style="display:none">오늘</span>
        </div>
    </div>
    <button class="nav-btn" id="btn-next">&#8250;</button>
    <button class="btn-today" id="btn-today" style="display:none">오늘로</button>
</div>

<!-- 진행률 -->
<div class="progress-bar-wrap" id="progress-wrap">
    <div class="progress-bar-track"><div class="progress-bar-fill" id="progress-fill"></div></div>
    <div class="progress-text" id="progress-text"></div>
</div>

<!-- 카테고리 필터 탭 -->
<div class="cat-tabs" id="cat-tabs">
    <button class="cat-tab active" data-cat="all">전체</button>
    <button class="cat-tab" data-cat="school">학교</button>
    <button class="cat-tab" data-cat="manage">관리</button>
    <button class="cat-tab" data-cat="home">집</button>
    <button class="cat-tab" data-cat="other">기타</button>
</div>

<!-- 태스크 목록 -->
<div class="scroll-area" id="task-area"></div>

<!-- 하단 입력창 -->
<div class="bottom-bar">
    <div class="add-row">
        <input class="add-input" id="add-input" type="search" placeholder="할 일 입력…" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
        <button class="btn-mic" id="btn-mic" title="음성 입력"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 1 3 3v7a3 3 0 0 1-6 0V5a3 3 0 0 1 3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="22"/></svg></button>
        <button class="btn-add-text" id="btn-add" title="추가"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></button>
    </div>
    <div class="options-row">
        <span class="opt-label">시간</span>
        <input class="opt-input" id="opt-time" type="time">
        <span class="opt-label">분류</span>
        <select class="opt-input" id="opt-cat">
            <option value="other">기타</option>
            <option value="school">학교</option>
            <option value="manage">관리</option>
            <option value="home">집</option>
        </select>
        <span class="opt-label">우선</span>
        <select class="opt-input" id="opt-prio">
            <option value="normal">보통</option>
            <option value="high">높음</option>
            <option value="low">낮음</option>
        </select>
        <span class="opt-label">알람</span>
        <select class="opt-input" id="opt-alarm">
            <option value="">없음</option>
            <option value="4h">4시간 전</option>
            <option value="1d">하루 전</option>
            <option value="both">둘 다</option>
        </select>
    </div>
</div>

<!-- 음성 오버레이 -->
<div class="voice-overlay" id="voice-overlay">
    <div class="voice-circle"><svg width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 1 3 3v7a3 3 0 0 1-6 0V5a3 3 0 0 1 3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="22"/></svg></div>
    <div class="voice-text">말씀해 주세요</div>
    <div class="voice-result" id="voice-result">예: "오전 10시 회의 그리고 저녁 운동"</div>
    <button class="btn-voice-cancel" id="btn-voice-cancel">취소</button>
</div>

<!-- 토스트 -->
<div class="toast" id="toast"></div>

<script>
// ── 상수 ────────────────────────────────────────────────────
const PRIO_LABEL = { high: '높음', normal: '보통', low: '낮음' };
const PRIO_DOT = {
    high: `<svg width="8" height="8" viewBox="0 0 8 8"><circle cx="4" cy="4" r="4" fill="#d93025"/></svg>`,
    normal: `<svg width="8" height="8" viewBox="0 0 8 8"><circle cx="4" cy="4" r="4" fill="#4285f4"/></svg>`,
    low: `<svg width="8" height="8" viewBox="0 0 8 8"><circle cx="4" cy="4" r="4" fill="#80868b"/></svg>`
};
const PRIO_CHIP  = { high: 'chip-prio-high', normal: 'chip-prio-normal', low: 'chip-prio-low' };
const KR_NUMS = { 한:1,두:2,세:3,네:4,다섯:5,여섯:6,일곱:7,여덟:8,아홉:9,열:10,열한:11,열두:12 };
const CATS = {
    school: { label: '학교', chipClass: 'chip-cat-school' },
    manage: { label: '관리', chipClass: 'chip-cat-manage' },
    home:   { label: '집',   chipClass: 'chip-cat-home'   },
    other:  { label: '기타', chipClass: 'chip-cat-other'  }
};

// ── 상태 ────────────────────────────────────────────────────
let curDate = new Date(); curDate.setHours(0,0,0,0);
let curCatFilter = 'all';

function dateKey(d) {
    return `${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}`;
}
function p2(n) { return String(n).padStart(2,'0'); }
function todayMidnight() { const d = new Date(); d.setHours(0,0,0,0); return d; }

// ── 저장 ────────────────────────────────────────────────────
function loadPlan(key) {
    try { return JSON.parse(localStorage.getItem('dp2_' + key) || '{"tasks":[]}'); }
    catch { return {tasks:[]}; }
}
function savePlan(key, plan) {
    localStorage.setItem('dp2_' + key, JSON.stringify(plan));
    rescheduleAllAlarms();
}
function genId() { return Date.now().toString(36) + Math.random().toString(36).slice(2,6); }

// ── 음성 여러 할일 분리 ──────────────────────────────────────
function parseVoiceMulti(text) {
    // "그리고", "하고", "이랑/랑", "또", "그다음", 쉼표로 분리
    const parts = text.split(/,\s*|그리고\s*|\s+하고\s+|\s+이랑\s+|\s+랑\s+|\s+또\s+|그다음에?\s*/);
    const segments = parts.map(s => s.trim()).filter(s => s.length > 1);
    return segments.length > 0 ? segments.map(parseVoice) : [parseVoice(text)];
}

// ── 음성 파싱 ────────────────────────────────────────────────
function parseVoice(text) {
    let title = text;
    let dateOffset = 0; // 0=오늘, 1=내일, 2=모레
    let hour = null, minute = 0;

    // 날짜
    if (/모레/.test(text)) { dateOffset = 2; title = title.replace(/모레\s?/,''); }
    else if (/내일/.test(text)) { dateOffset = 1; title = title.replace(/내일\s?/,''); }
    else if (/오늘/.test(text)) { title = title.replace(/오늘\s?/,''); }

    // 오전/오후
    const pm = /오후/.test(title);
    const am = /오전/.test(title);
    title = title.replace(/(오전|오후)\s?/,'');

    // 시간 (숫자 + '시')
    const numMatch = title.match(/(\d{1,2})시\s?(\d{1,2}분?)?/);
    if (numMatch) {
        hour = parseInt(numMatch[1]);
        if (numMatch[2]) minute = parseInt(numMatch[2]);
        if (pm && hour < 12) hour += 12;
        if (am && hour === 12) hour = 0;
        title = title.replace(numMatch[0], '').trim();
    } else {
        // 한글 숫자
        for (const [k,v] of Object.entries(KR_NUMS)) {
            const re = new RegExp(k + '시');
            if (re.test(title)) {
                hour = pm && v < 12 ? v + 12 : v;
                title = title.replace(re,'').trim();
                break;
            }
        }
        // 특수 시간대
        if (/아침/.test(title)) { hour = 8; title = title.replace(/아침\s?/,''); }
        else if (/점심/.test(title)) { hour = 12; title = title.replace(/점심\s?/,''); }
        else if (/저녁/.test(title)) { hour = 18; title = title.replace(/저녁\s?/,''); }
        else if (/밤/.test(title)) { hour = 21; title = title.replace(/밤\s?/,''); }
    }

    const taskDate = new Date(todayMidnight());
    taskDate.setDate(taskDate.getDate() + dateOffset);

    // 카테고리 감지: 명시적 탭 언급 → 키워드 순
    let category = '';
    if (/학교\s?탭/.test(title))      { category = 'school'; title = title.replace(/학교\s?탭\s?/,''); }
    else if (/관리\s?탭/.test(title)) { category = 'manage'; title = title.replace(/관리\s?탭\s?/,''); }
    else if (/집\s?탭/.test(title))   { category = 'home';   title = title.replace(/집\s?탭\s?/,''); }
    else if (/기타\s?탭/.test(title)) { category = 'other';  title = title.replace(/기타\s?탭\s?/,''); }
    else if (/학교|수업|과제|강의|시험/.test(title)) category = 'school';
    else if (/관리|행정|처리|업무/.test(title))       category = 'manage';
    else if (/집안일|청소|요리|장보기/.test(title))   category = 'home';

    const time = hour !== null ? `${p2(hour)}:${p2(minute)}` : '';
    return { title: title.trim() || text, date: dateKey(taskDate), time, category };
}

// ── 렌더 ────────────────────────────────────────────────────
function render() {
    const key = dateKey(curDate);
    const plan = loadPlan(key);
    const tasks = plan.tasks || [];

    const today = todayMidnight();
    const isToday = dateKey(curDate) === dateKey(today);

    // 날짜
    document.getElementById('date-weekday').textContent =
        curDate.toLocaleDateString('ko-KR', { year:'numeric', month:'long', day:'numeric' });
    document.getElementById('date-main-text').textContent =
        curDate.toLocaleDateString('ko-KR', { weekday:'long' });
    document.getElementById('today-chip').style.display = isToday ? '' : 'none';
    document.getElementById('btn-today').style.display = isToday ? 'none' : '';

    // 진행률 (전체 기준)
    const allActive = tasks.filter(t => !t.done);
    const allDone   = tasks.filter(t => t.done);

    // 카테고리 필터
    const filtered = curCatFilter === 'all' ? tasks : tasks.filter(t => (t.category||'other') === curCatFilter);
    const active = filtered.filter(t => !t.done);
    const done   = filtered.filter(t => t.done);
    const pw = document.getElementById('progress-wrap');
    if (tasks.length > 0) {
        pw.style.display = '';
        const pct = Math.round(allDone.length / tasks.length * 100);
        document.getElementById('progress-fill').style.width = pct + '%';
        document.getElementById('progress-text').textContent =
            `${allDone.length}/${tasks.length} 완료 · ${pct}%`;
    } else {
        pw.style.display = 'none';
    }

    // 태스크 목록
    const area = document.getElementById('task-area');
    if (tasks.length === 0) {
        area.innerHTML = `
            <div class="empty-state">
                <div class="empty-icon"><svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="#dadce0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2v4"/><path d="M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/><path d="m9 16 2 2 4-4"/></svg></div>
                <div class="empty-text">오늘의 할 일을 추가하거나<br>음성으로 말해보세요</div>
            </div>`;
        return;
    }

    area.innerHTML =
        (active.length ? active.map(t => taskHTML(t)).join('') : '') +
        (done.length ? `
            <div class="done-header" id="done-hdr">
                <span class="done-arrow" id="done-arrow"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg></span>
                완료 ${done.length}개
            </div>
            <div class="done-list" id="done-list">
                ${done.map(t => taskHTML(t)).join('')}
            </div>` : '');

    bindEvents(plan, key);
}

function taskHTML(t) {
    const timeChip = t.time
        ? `<span class="meta-chip chip-time"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg> ${t.time}</span>` : '';
    const alarmChip = t.alarm && t.alarm !== 'none'
        ? `<span class="meta-chip chip-alarm"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg> ${t.alarm === '4h' ? '4시간 전' : t.alarm === '1d' ? '하루 전' : '4시간/하루 전'}</span>` : '';
    const prioChip = t.priority && t.priority !== 'normal'
        ? `<span class="meta-chip ${PRIO_CHIP[t.priority]}">${PRIO_DOT[t.priority]} ${PRIO_LABEL[t.priority]}</span>` : '';
    const catKey = t.category || 'other';
    const catInfo = CATS[catKey] || CATS.other;
    const catChip = `<span class="meta-chip chip-cat ${catInfo.chipClass}">${catInfo.label}</span>`;

    return `
    <div class="task-card${t.done ? ' done' : ''}" data-tid="${t.id}">
        <button class="check-btn${t.done ? ' checked' : ''}" data-tid="${t.id}">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
                ${t.done ? '<path d="M20 6 9 17l-5-5"/>' : ''}
            </svg>
        </button>
        <div class="task-body">
            <input class="task-title-inp" value="${esc(t.title)}" data-tid="${t.id}" ${t.done ? 'disabled' : ''}>
            <div class="task-meta">${catChip}${timeChip}${alarmChip}${prioChip}</div>
        </div>
        <button class="btn-del-task" data-tid="${t.id}" title="삭제"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    </div>`;
}

function esc(s) {
    return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function bindEvents(plan, key) {
    // 완료 체크
    document.querySelectorAll('.check-btn').forEach(btn => {
        btn.onclick = () => {
            const t = plan.tasks.find(x => x.id === btn.dataset.tid);
            if (t) { t.done = !t.done; savePlan(key, plan); render(); }
        };
    });
    // 삭제
    document.querySelectorAll('.btn-del-task').forEach(btn => {
        btn.onclick = () => {
            plan.tasks = plan.tasks.filter(x => x.id !== btn.dataset.tid);
            savePlan(key, plan); render();
        };
    });
    // 제목 수정
    document.querySelectorAll('.task-title-inp').forEach(inp => {
        let tm;
        inp.addEventListener('input', () => {
            clearTimeout(tm);
            tm = setTimeout(() => {
                const t = plan.tasks.find(x => x.id === inp.dataset.tid);
                if (t) { t.title = inp.value; savePlan(key, plan); }
            }, 600);
        });
    });
    // 길게 눌러서 삭제 버튼 표시
    document.querySelectorAll('.task-card').forEach(card => {
        let lt;
        card.addEventListener('pointerdown', () => {
            lt = setTimeout(() => card.classList.toggle('show-del'), 500);
        });
        card.addEventListener('pointerup', () => clearTimeout(lt));
        card.addEventListener('pointercancel', () => clearTimeout(lt));
    });
    // 완료 접기
    const doneHdr = document.getElementById('done-hdr');
    if (doneHdr) {
        doneHdr.onclick = () => {
            const list = document.getElementById('done-list');
            const arrow = document.getElementById('done-arrow');
            list.classList.toggle('open');
            arrow.classList.toggle('open');
        };
    }
}

// ── 태스크 추가 ────────────────────────────────────────────
function addTask(title, dateStr, time, prio, alarm, category) {
    if (!title.trim()) return;
    const key = dateStr || dateKey(curDate);
    const plan = loadPlan(key);
    plan.tasks.push({ id: genId(), title: title.trim(), time: time||'', priority: prio||'normal', alarm: alarm||'', category: category||'other', done: false, createdAt: Date.now() });

    // 날짜 기준 정렬: 시간 있는 것 먼저, 그 다음 우선순위 순
    plan.tasks.sort((a,b) => {
        if (a.done !== b.done) return a.done ? 1 : -1;
        if (a.time && b.time) return a.time < b.time ? -1 : 1;
        if (a.time) return -1; if (b.time) return 1;
        const po = {high:0, normal:1, low:2};
        return (po[a.priority]||1) - (po[b.priority]||1);
    });

    savePlan(key, plan);
    // 추가한 날짜가 현재 보는 날짜면 바로 렌더
    if (key === dateKey(curDate)) render();
    showToast(dateStr && dateStr !== dateKey(curDate)
        ? `"${title.trim()}" → ${dateStr} 추가됨` : `"${title.trim()}" 추가됨`);
}

// ── 알람 스케줄 ────────────────────────────────────────────
let sw = null;

async function initSW() {
    if (!('serviceWorker' in navigator)) return;
    try {
        const reg = await navigator.serviceWorker.register('./sw.js');
        await navigator.serviceWorker.ready;
        sw = reg.active || reg.waiting || reg.installing;
        navigator.serviceWorker.addEventListener('controllerchange', () => {
            sw = navigator.serviceWorker.controller;
        });
        rescheduleAllAlarms();
    } catch(e) { console.warn('SW 등록 실패', e); }
}

function rescheduleAllAlarms() {
    if (!sw) { sw = navigator.serviceWorker?.controller; }
    if (!sw) return;

    const now = Date.now();
    // 오늘 + 내일 + 모레 계획만 체크
    for (let i = -1; i <= 7; i++) {
        const d = new Date(todayMidnight());
        d.setDate(d.getDate() + i);
        const key = dateKey(d);
        const plan = loadPlan(key);
        (plan.tasks || []).forEach(t => {
            if (!t.time || !t.alarm || t.alarm === 'none' || t.done) return;
            const [hh, mm] = t.time.split(':').map(Number);
            const taskMs = new Date(key + 'T' + p2(hh) + ':' + p2(mm) + ':00').getTime();

            const schedules = [];
            if (t.alarm === '4h' || t.alarm === 'both') schedules.push({ id: t.id+'_4h', offset: 4*60*60*1000, label:'4시간 후' });
            if (t.alarm === '1d' || t.alarm === 'both') schedules.push({ id: t.id+'_1d', offset: 24*60*60*1000, label:'내일' });

            schedules.forEach(({id, offset, label}) => {
                const fireAt = taskMs - offset;
                const delay  = fireAt - now;
                if (delay > 0 && delay < 7 * 24 * 60 * 60 * 1000) {
                    sw.postMessage({
                        type: 'SCHEDULE',
                        id,
                        title: '일일계획 알림 🔔',
                        body: `[${label}] ${t.time} ${t.title}`,
                        delay
                    });
                }
            });
        });
    }
}

// ── 알림 권한 ────────────────────────────────────────────────
async function requestNotifPerm() {
    if (!('Notification' in window)) { showToast('이 브라우저는 알림을 지원하지 않아요'); return; }
    const perm = await Notification.requestPermission();
    if (perm === 'granted') {
        showToast('알림이 허용됐어요');
        updateNotifBtn();
        rescheduleAllAlarms();
    } else {
        showToast('알림이 차단됐어요. 설정에서 허용해 주세요');
    }
}

// ── 음성 인식 ────────────────────────────────────────────────
let recognition = null;
let isListening = false;

function initVoice() {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) return;
    recognition = new SR();
    recognition.lang = 'ko-KR';
    recognition.continuous = false;
    recognition.interimResults = true;

    recognition.onresult = e => {
        const transcript = [...e.results].map(r => r[0].transcript).join('');
        document.getElementById('voice-result').textContent = transcript;
        if (e.results[e.results.length-1].isFinal) {
            stopListening();
            const parsedList = parseVoiceMulti(transcript);
            const prio  = document.getElementById('opt-prio').value;
            const alarm = document.getElementById('opt-alarm').value;
            const cat   = document.getElementById('opt-cat').value;

            if (parsedList.length > 1) {
                // 여러 할일: 모두 바로 추가
                parsedList.forEach(p => addTask(p.title, p.date, p.time, prio, alarm, p.category || cat));
                showToast(`${parsedList.length}개 할일 추가됨`);
            } else {
                // 단일 할일: 입력창에 채워서 확인 후 추가
                const parsed = parsedList[0];
                document.getElementById('add-input').value = parsed.title;
                if (parsed.time) document.getElementById('opt-time').value = parsed.time;
                if (parsed.category) document.getElementById('opt-cat').value = parsed.category;
                if (parsed.date !== dateKey(curDate)) {
                    addTask(parsed.title, parsed.date, parsed.time, prio, alarm,
                        parsed.category || cat);
                    document.getElementById('add-input').value = '';
                } else {
                    document.getElementById('add-input').focus();
                }
            }
        }
    };
    recognition.onerror = () => stopListening();
    recognition.onend = () => { if (isListening) stopListening(); };
}

function startListening() {
    if (!recognition) { showToast('음성 인식을 지원하지 않는 브라우저예요'); return; }
    isListening = true;
    document.getElementById('voice-overlay').classList.add('active');
    document.getElementById('voice-result').textContent = '예: "오전 10시 회의 그리고 저녁 운동"';
    document.getElementById('btn-mic').classList.add('listening');
    try { recognition.start(); } catch(e) { stopListening(); }
}

function stopListening() {
    isListening = false;
    document.getElementById('voice-overlay').classList.remove('active');
    document.getElementById('btn-mic').classList.remove('listening');
    try { recognition.stop(); } catch(e) {}
}

// ── 토스트 ────────────────────────────────────────────────
let toastTimer;
function showToast(msg) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), 2500);
}

// ── 이벤트 ────────────────────────────────────────────────
document.getElementById('btn-prev').onclick = () => { curDate.setDate(curDate.getDate()-1); render(); };
document.getElementById('btn-next').onclick = () => { curDate.setDate(curDate.getDate()+1); render(); };
document.getElementById('btn-today').onclick = () => { curDate = todayMidnight(); render(); };
document.getElementById('btn-notif-perm').onclick = requestNotifPerm;
document.getElementById('btn-mic').onclick = () => isListening ? stopListening() : startListening();
document.getElementById('btn-voice-cancel').onclick = stopListening;

document.getElementById('btn-add').onclick = () => {
    const title = document.getElementById('add-input').value.trim();
    if (!title) return;
    addTask(title, null,
        document.getElementById('opt-time').value,
        document.getElementById('opt-prio').value,
        document.getElementById('opt-alarm').value,
        document.getElementById('opt-cat').value);
    document.getElementById('add-input').value = '';
    document.getElementById('opt-time').value = '';
    document.getElementById('opt-prio').value = 'normal';
    document.getElementById('opt-alarm').value = '';
    document.getElementById('opt-cat').value = 'other';
};

document.getElementById('add-input').addEventListener('keydown', e => {
    if (e.key === 'Enter') document.getElementById('btn-add').click();
});

document.getElementById('cat-tabs').addEventListener('click', e => {
    const tab = e.target.closest('.cat-tab');
    if (!tab) return;
    curCatFilter = tab.dataset.cat;
    document.querySelectorAll('.cat-tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    render();
});

// ── 알림 상태 표시 ────────────────────────────────────────
function updateNotifBtn() {
    const btn = document.getElementById('btn-notif-perm');
    if (!('Notification' in window)) { btn.style.display = 'none'; return; }
    if (Notification.permission === 'granted') {
        btn.innerHTML = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>`;
        btn.title = '알림 켜짐';
    } else {
        btn.innerHTML = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8.7 3A6 6 0 0 1 18 8a21.3 21.3 0 0 0 .6 5"/><path d="M17 17H3s3-2 3-9a4.67 4.67 0 0 1 .3-1.7"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/><line x1="2" y1="2" x2="22" y2="22"/></svg>`;
        btn.title = '알림 허용 (탭)';
    }
}

// ── 초기화 ────────────────────────────────────────────────
initVoice();
initSW();
updateNotifBtn();
render();
</script>
