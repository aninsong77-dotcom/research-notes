<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>일일계획</title>
<link rel="manifest" href="manifest.json">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{width:100%;height:100%;overflow:hidden;background:#f1f3f4;touch-action:none;font-family:'Apple SD Gothic Neo','Noto Sans KR',-apple-system,sans-serif;}

/* ── 뷰포트 & 캔버스 ── */
#vp{position:fixed;inset:0;overflow:hidden;cursor:grab;}
#vp:active{cursor:grabbing;}
#canvas{position:absolute;top:0;left:0;transform-origin:0 0;will-change:transform;}

/* ── 상단바 ── */
#topbar{
  position:fixed;top:0;left:0;right:0;z-index:100;
  height:calc(env(safe-area-inset-top,0px) + 56px);
  padding-top:env(safe-area-inset-top,0px);
  background:linear-gradient(180deg,rgba(241,243,244,1) 65%,rgba(241,243,244,0));
  display:flex;align-items:center;padding-left:16px;padding-right:12px;gap:8px;
  pointer-events:none;
}
#topbar>*{pointer-events:all;}
#date-label{color:#202124;font-size:15px;font-weight:800;flex:1;letter-spacing:-.3px;}
.tbtn{
  width:40px;height:40px;border-radius:50%;border:none;
  background:white;color:#5f6368;cursor:pointer;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
  box-shadow:0 1px 4px rgba(0,0,0,.18);
}
.tbtn:active{background:#e8f0fe;}
.tbtn.listening{background:#e53935;color:white;animation:pulse 1s infinite;}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(229,57,53,.5)}50%{box-shadow:0 0 0 10px rgba(229,57,53,0)}}

/* ── 줌 힌트 ── */
#hint{
  position:fixed;bottom:16px;left:50%;transform:translateX(-50%);
  color:#5f6368;font-size:12px;font-weight:600;
  pointer-events:none;z-index:50;transition:opacity .5s;
  background:white;padding:6px 14px;border-radius:20px;
  box-shadow:0 1px 6px rgba(0,0,0,.15);
}

/* ── 하단 시트 ── */
#sheet{
  position:fixed;bottom:0;left:0;right:0;z-index:300;
  background:#ffffff;border-radius:22px 22px 0 0;
  box-shadow:0 -8px 40px rgba(0,0,0,.35);
  transform:translateY(100%);transition:transform .32s cubic-bezier(.4,0,.2,1);
  max-height:72vh;display:flex;flex-direction:column;
  padding-bottom:env(safe-area-inset-bottom,0px);
}
#sheet.open{transform:translateY(0);}
#sh-handle{width:38px;height:4px;border-radius:2px;background:#e0e0e0;margin:10px auto 0;flex-shrink:0;}
#sh-head{
  padding:10px 16px 6px;font-size:15px;font-weight:800;color:#37474f;
  display:flex;align-items:center;justify-content:space-between;flex-shrink:0;
}
#sh-close{border:none;background:none;font-size:24px;color:#b0bec5;cursor:pointer;line-height:1;padding:2px 4px;}
#add-row{display:flex;gap:8px;padding:4px 12px 8px;flex-shrink:0;}
#add-inp{
  flex:1;border:2px solid #e8eaed;border-radius:14px;
  padding:10px 13px;font-size:14px;font-family:inherit;outline:none;color:#37474f;background:#f8f9fa;
}
#add-inp:focus{border-color:#29b6f6;background:white;}
#add-inp::-webkit-search-cancel-button{display:none;}
#add-btn{
  width:42px;height:42px;border-radius:50%;border:none;flex-shrink:0;
  background:linear-gradient(135deg,#0288d1,#26c6da);color:white;
  font-size:24px;cursor:pointer;display:flex;align-items:center;justify-content:center;
  box-shadow:0 2px 8px rgba(2,136,209,.4);
}
#sh-tasks{overflow-y:auto;flex:1;padding:0 12px 16px;display:flex;flex-direction:column;gap:8px;}

/* 카테고리 선택 */
#cat-opts{display:flex;gap:6px;padding:0 12px 8px;overflow-x:auto;scrollbar-width:none;flex-shrink:0;}
#cat-opts::-webkit-scrollbar{display:none;}
.copt{
  border:2px solid transparent;border-radius:10px;padding:5px 12px;
  font-size:12px;font-weight:800;font-family:inherit;cursor:pointer;
  background:#f0f0f0;color:#78909c;white-space:nowrap;flex-shrink:0;
}
.copt.sel{color:white;}

/* 태스크 행 */
.trow{
  display:flex;align-items:center;gap:9px;
  background:#f8f9fa;border-radius:14px;padding:10px 12px;
  border-left:5px solid var(--cc,#b0bec5);
}
.trow.done{opacity:.45;}
.tchk{
  width:26px;height:26px;border:2.5px solid #cfd8dc;border-radius:50%;
  background:none;cursor:pointer;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;color:transparent;
  transition:all .15s;
}
.tchk.on{background:var(--cc,#039be5);border-color:var(--cc);color:white;}
.tinfo{flex:1;min-width:0;}
.ttitle{font-size:14px;font-weight:600;color:#37474f;}
.ttime{font-size:12px;color:#90a4ae;margin-top:2px;}
.tdel{border:none;background:none;color:#cfd8dc;cursor:pointer;padding:4px;font-size:20px;line-height:1;}

/* ── 음성 오버레이 ── */
#vover{
  display:none;position:fixed;inset:0;z-index:500;
  background:rgba(1,87,155,.92);
  flex-direction:column;align-items:center;justify-content:center;gap:18px;
}
#vover.on{display:flex;}
.vring{
  width:100px;height:100px;border-radius:50%;
  background:linear-gradient(135deg,#f4511e,#ffa000);
  display:flex;align-items:center;justify-content:center;
  animation:pulse 1s infinite;
}
#vtxt{color:white;font-size:16px;font-weight:800;}
#vres{color:rgba(255,255,255,.88);font-size:14px;min-height:20px;padding:0 32px;text-align:center;}
#vcancel{
  background:rgba(255,255,255,.18);border:2px solid rgba(255,255,255,.45);
  color:white;border-radius:20px;padding:9px 26px;
  font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;
}

/* ── 데이 패널 ── */
#dpanel{
  position:fixed;bottom:0;left:0;right:0;z-index:200;
  height:43vh;background:#fff;border-radius:22px 22px 0 0;
  box-shadow:0 -4px 28px rgba(0,0,0,.16);
  transform:translateY(100%);transition:transform .35s cubic-bezier(.4,0,.2,1);
  display:flex;flex-direction:column;
  padding-bottom:env(safe-area-inset-bottom,0px);
}
#dpanel.open{transform:translateY(0);}
#dp-handle{width:38px;height:4px;border-radius:2px;background:#e0e0e0;margin:10px auto 4px;flex-shrink:0;}
#dp-head{padding:0 16px 6px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
#dp-date{font-size:15px;font-weight:800;color:#202124;}
#dp-close{border:none;background:none;font-size:24px;color:#b0bec5;cursor:pointer;line-height:1;padding:2px 6px;}
#dp-cards{
  flex:1;overflow-x:auto;overflow-y:hidden;
  display:flex;align-items:stretch;gap:10px;padding:4px 16px;
  scrollbar-width:none;
}
#dp-cards::-webkit-scrollbar{display:none;}
.dcard{
  flex-shrink:0;width:96px;background:#f8f9fa;border-radius:16px;
  padding:10px 8px 10px;display:flex;flex-direction:column;align-items:center;gap:5px;
  border-top:4px solid var(--cc,#b0bec5);position:relative;
  transition:opacity .2s;
}
.dcard.done{opacity:.42;}
.dcard-icon{font-size:28px;line-height:1.1;}
.dcard-title{font-size:11px;font-weight:700;color:#37474f;text-align:center;word-break:break-all;line-height:1.3;flex:1;}
.dcard-time{font-size:10px;color:#90a4ae;font-weight:600;}
.dcard-chk{
  position:absolute;top:6px;right:6px;width:20px;height:20px;border-radius:50%;
  border:2px solid #cfd8dc;background:none;cursor:pointer;
  display:flex;align-items:center;justify-content:center;color:transparent;font-size:10px;font-weight:700;
  transition:all .15s;
}
.dcard-chk.on{background:var(--cc);border-color:var(--cc);color:white;}
.dcard-empty{
  flex-shrink:0;width:160px;border-radius:16px;background:#f8f9fa;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:6px;padding:16px;color:#b0bec5;font-size:12px;font-weight:600;text-align:center;
}
#dp-add{
  display:flex;gap:8px;padding:8px 12px 10px;flex-shrink:0;
  border-top:1px solid #f1f3f4;
}
#dp-inp{
  flex:1;border:2px solid #e8eaed;border-radius:14px;
  padding:9px 12px;font-size:14px;font-family:inherit;outline:none;color:#37474f;background:#f8f9fa;
}
#dp-inp:focus{border-color:#4285F4;background:white;}
#dp-inp::-webkit-search-cancel-button{display:none;}
#dp-addbtn{
  width:40px;height:40px;border-radius:50%;border:none;flex-shrink:0;
  background:#4285F4;color:white;font-size:22px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 2px 8px rgba(66,133,244,.35);
}

/* ── 토스트 ── */
#toast{
  position:fixed;bottom:24px;left:50%;
  transform:translateX(-50%) translateY(20px);
  background:#37474f;color:white;border-radius:20px;
  padding:9px 18px;font-size:13px;font-weight:700;
  z-index:600;opacity:0;transition:opacity .25s,transform .25s;
  white-space:nowrap;pointer-events:none;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>

<div id="topbar">
  <div id="date-label"></div>
  <button class="tbtn" id="btn-brief" aria-label="오늘 브리핑">
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
  </button>
  <button class="tbtn" id="btn-mic" aria-label="음성 입력">
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 2a3 3 0 0 1 3 3v7a3 3 0 0 1-6 0V5a3 3 0 0 1 3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="22"/></svg>
  </button>
</div>

<div id="vp"><svg id="canvas" xmlns="http://www.w3.org/2000/svg"></svg></div>

<div id="sheet">
  <div id="sh-handle"></div>
  <div id="sh-head">
    <span id="sh-title">일정</span>
    <button id="sh-close" aria-label="닫기">×</button>
  </div>
  <div id="cat-opts"></div>
  <div id="add-row">
    <input id="add-inp" type="search" placeholder="할 일 입력…" autocomplete="off" spellcheck="false">
    <button id="add-btn" aria-label="추가">+</button>
  </div>
  <div id="sh-tasks"></div>
</div>

<div id="dpanel">
  <div id="dp-handle"></div>
  <div id="dp-head">
    <div id="dp-date"></div>
    <button id="dp-close" aria-label="닫기">×</button>
  </div>
  <div id="dp-cards"></div>
  <div id="dp-add">
    <input id="dp-inp" type="search" placeholder="할 일 추가…" autocomplete="off" spellcheck="false">
    <button id="dp-addbtn" aria-label="추가">+</button>
  </div>
</div>

<div id="vover">
  <div class="vring">
    <svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.8" stroke-linecap="round"><path d="M12 2a3 3 0 0 1 3 3v7a3 3 0 0 1-6 0V5a3 3 0 0 1 3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="22"/></svg>
  </div>
  <div id="vtxt">말씀해 주세요</div>
  <div id="vres">할 일 추가 또는 "오늘 할일 알려줘"</div>
  <button id="vcancel">취소</button>
</div>

<div id="hint">핀치로 확대 · 드래그로 이동</div>
<div id="toast"></div>

<script>
// ── 상수 ─────────────────────────────────────────────────────
const CATS = {
  school:{ label:'학교', color:'#4285F4', bg:'rgba(66,133,244,.28)' },
  manage:{ label:'관리', color:'#EA4335', bg:'rgba(234,67,53,.28)' },
  home:  { label:'집',   color:'#34A853', bg:'rgba(52,168,83,.28)' },
  other: { label:'기타', color:'#FBBC04', bg:'rgba(251,188,4,.28)' }
};
const CAT_ORDER = ['school','manage','home','other'];
const KR_MONTHS = ['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];
const KR_DAYS   = ['월','화','수','목','금','토','일'];
const MONTH_COLORS=[
  {c:'#4285F4',bg:'#A8C7FA'}, {c:'#EA4335',bg:'#F28B82'},
  {c:'#34A853',bg:'#81C995'}, {c:'#FBBC04',bg:'#FDD663'},
  {c:'#4285F4',bg:'#A8C7FA'}, {c:'#EA4335',bg:'#F28B82'},
  {c:'#34A853',bg:'#81C995'}, {c:'#FBBC04',bg:'#FDD663'},
  {c:'#4285F4',bg:'#A8C7FA'}, {c:'#EA4335',bg:'#F28B82'},
  {c:'#34A853',bg:'#81C995'}, {c:'#FBBC04',bg:'#FDD663'},
];
const KR_NUMS   = {한:1,두:2,세:3,네:4,다섯:5,여섯:6,일곱:7,여덟:8,아홉:9,열:10,열한:11,열두:12};

// ── 지오메트리 상수 ──────────────────────────────────────────
const RI1 = 14;   // 24h ring 내반경
const RI2 = 32;   // 24h ring 외반경
const RO1 = 36;   // 7day ring 내반경
const RO2 = 60;   // 7day ring 외반경
const WEEK_W  = 128; // 주 원 가로 간격 (축소)
const MONTH_H = 168; // 월 행 세로 간격
const PAD_L   = 52;  // 좌측 여백
const PAD_T   = 62;  // 상단 여백

// ── 저장 ─────────────────────────────────────────────────────
const p2 = n => String(n).padStart(2,'0');
const dateKey = d => `${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}`;
const today0  = () => { const d=new Date(); d.setHours(0,0,0,0); return d; };
const loadPlan = k => { try{return JSON.parse(localStorage.getItem('dp2_'+k)||'{"tasks":[]}')}catch{return{tasks:[]}} };
const savePlan = (k,p) => { localStorage.setItem('dp2_'+k,JSON.stringify(p)); renderCanvas(); };
const genId    = () => Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const esc = s => String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

// ── 주 레이아웃 ───────────────────────────────────────────────
function getWeeks(year){
  const weeks=[];
  let mon=new Date(year,0,1);
  const d0=mon.getDay();
  mon.setDate(mon.getDate()-(d0===0?6:d0-1));
  while(true){
    const days=Array.from({length:7},(_,i)=>{ const d=new Date(mon); d.setDate(d.getDate()+i); return d; });
    const thu=days[3];
    if(thu.getFullYear()>year) break;
    if(thu.getFullYear()===year) weeks.push({mon:new Date(mon),days,month:thu.getMonth()});
    mon.setDate(mon.getDate()+7);
  }
  const mCnt=new Array(12).fill(0);
  return weeks.map(w=>{ const col=mCnt[w.month]++;
    return {...w,col,cx:PAD_L+col*WEEK_W+WEEK_W/2,cy:PAD_T+w.month*MONTH_H+MONTH_H/2};
  });
}

// ── 색 ───────────────────────────────────────────────────────
function dayColors(dateStr){
  const tasks=(loadPlan(dateStr).tasks||[]);
  const cnt={};
  tasks.filter(t=>!t.done).forEach(t=>{ const c=t.category||'other'; cnt[c]=(cnt[c]||0)+1; });
  if(!Object.keys(cnt).length) return null;
  return Object.entries(cnt).sort((a,b)=>b[1]-a[1])[0][0]; // 가장 많은 카테고리 키
}

function hourColor(dateStr,h){
  const tasks=(loadPlan(dateStr).tasks||[]);
  // 해당 시간대에 걸치는 모든 할일 (HH:MM → 시 단위 매핑)
  const t=tasks.find(t=>t.time&&!t.done&&parseInt(t.time.split(':')[0])===h);
  return t?CATS[t.category||'other'].color:null;
}

function hourColorDone(dateStr,h){
  const tasks=(loadPlan(dateStr).tasks||[]);
  const t=tasks.find(t=>t.time&&t.done&&parseInt(t.time.split(':')[0])===h);
  return t?CATS[t.category||'other'].bg:null; // 완료된 건 연한 색
}

// ── SVG 유틸 ─────────────────────────────────────────────────
const svgNS='http://www.w3.org/2000/svg';
const el=(tag,a={})=>{const e=document.createElementNS(svgNS,tag);Object.entries(a).forEach(([k,v])=>e.setAttribute(k,v));return e;};
const A0=-Math.PI/2; // 12시 방향
const GAP=0.05;      // 조각 사이 틈

function annSector(cx,cy,r1,r2,a0,a1){
  const s=a0+GAP,e=a1-GAP;
  if(e<=s) return '';
  const lg=(e-s)>Math.PI?1:0;
  const c1s=Math.cos(s),s1s=Math.sin(s),c1e=Math.cos(e),s1e=Math.sin(e);
  return [`M${cx+r1*c1s} ${cy+r1*s1s}`,`L${cx+r2*c1s} ${cy+r2*s1s}`,
    `A${r2} ${r2} 0 ${lg} 1 ${cx+r2*c1e} ${cy+r2*s1e}`,
    `L${cx+r1*c1e} ${cy+r1*s1e}`,`A${r1} ${r1} 0 ${lg} 0 ${cx+r1*c1s} ${cy+r1*s1s}Z`].join(' ');
}

// ── 상태 ─────────────────────────────────────────────────────
let scale=0.52, panX=0, panY=0;
let selDate=dateKey(today0());
let selCat='other';
let curYear=new Date().getFullYear();
let weeks=[];
let briefWeek=null, currentBriefTimer=null;

// ── 캔버스 렌더 ───────────────────────────────────────────────
const svg=document.getElementById('canvas');

function renderCanvas(){
  svg.innerHTML='';
  const todayStr=dateKey(today0());
  weeks=getWeeks(curYear);

  const maxCol=Math.max(...weeks.map(w=>w.col));
  const W=PAD_L+(maxCol+1)*WEEK_W+PAD_L;
  const H=PAD_T+12*MONTH_H+PAD_T;
  svg.setAttribute('width',W); svg.setAttribute('height',H);

  // 크레파스 필터
  const defs=el('defs');
  defs.innerHTML=`<filter id="hand" x="-8%" y="-8%" width="116%" height="116%">
    <feTurbulence type="fractalNoise" baseFrequency="0.038" numOctaves="3" seed="8" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="2.8" xChannelSelector="R" yChannelSelector="G"/>
  </filter>`;
  svg.appendChild(defs);

  // 배경 클릭 (시트 닫기)
  const bg=el('rect',{x:0,y:0,width:W,height:H,fill:'transparent'});
  bg.addEventListener('click',()=>{ closeSheet(); closeDayPanel(); });
  svg.appendChild(bg);

  // 월별 배경 + 라벨
  KR_MONTHS.forEach((m,mi)=>{
    const mc=MONTH_COLORS[mi];
    // 월 배경 rect
    svg.appendChild(el('rect',{
      x:0,y:PAD_T+mi*MONTH_H+4,width:W,height:MONTH_H-8,
      fill:mc.bg,rx:'10','pointer-events':'none'
    }));
    // 클릭 영역
    const mArea=el('rect',{x:0,y:PAD_T+mi*MONTH_H,width:PAD_L-4,height:38,
      fill:'transparent','pointer-events':'all',style:'cursor:pointer'});
    mArea.addEventListener('click',e=>{e.stopPropagation();closeSheet();closeDayPanel();zoomToMonth(mi);});
    svg.appendChild(mArea);
    // 라벨
    const t=el('text',{x:8,y:PAD_T+mi*MONTH_H+22,fill:mc.c,
      'font-size':'13','font-weight':'700','font-family':'inherit','pointer-events':'none'});
    t.textContent=m; svg.appendChild(t);
  });

  // 주 원 렌더
  const LRMID=(RO1+RO2)/2; // 요일 라벨: 링 안쪽 중간
  weeks.forEach((week,wi)=>{
    const {cx,cy,days,month}=week;
    const mc=MONTH_COLORS[month];
    const isBrief=briefWeek&&briefWeek.mon.getTime()===week.mon.getTime();
    const g=el('g');
    g.style.cursor='pointer';

    // 히트 영역 (필터 없음)
    g.appendChild(el('circle',{cx,cy,r:RO2+4,fill:'rgba(0,0,0,0)','pointer-events':'all'}));

    // 크레파스 필터 서브그룹
    const gv=el('g');
    gv.setAttribute('filter','url(#hand)');

    // 외곽 테두리
    gv.appendChild(el('circle',{cx,cy,r:RO2+4,fill:'none',
      stroke:mc.c,'stroke-width':'2',opacity:'0.55','pointer-events':'none'}));

    // 바깥 링: 7일
    days.forEach((day,di)=>{
      const dk=dateKey(day);
      const aS=A0+di*2*Math.PI/7, aE=A0+(di+1)*2*Math.PI/7;
      const catKey=dayColors(dk);
      const isToday=dk===todayStr;
      const isPast=day<today0();
      let fill=catKey?CATS[catKey].color:isPast?'#CFD8DC':'#ECEFF1';
      if(catKey){
        const allDone=(loadPlan(dk).tasks||[]).every(t=>t.done);
        if(allDone) fill=CATS[catKey].bg||fill;
      }
      const path=el('path',{d:annSector(cx,cy,RO1,RO2,aS,aE),fill,
        stroke:'rgba(255,255,255,0.4)','stroke-width':'1',
        'data-date':dk,'data-ring':'outer'});
      if(isToday){ path.setAttribute('stroke','#1A73E8'); path.setAttribute('stroke-width','2'); }
      if(dk===selDate){ path.setAttribute('stroke','#202124'); path.setAttribute('stroke-width','2'); }
      gv.appendChild(path);
    });

    if(!isBrief){
      // ── 일반 모드: 안쪽 링(24h) + 중심 원 ──
      const innerDayKey=week.days.some(d=>dateKey(d)===selDate)
        ?selDate:(week.days.some(d=>dateKey(d)===todayStr)?todayStr:null);

      gv.appendChild(el('circle',{cx,cy,r:(RI1+RI2)/2,fill:'none',
        stroke:'#E8EAF6','stroke-width':String(RI2-RI1),'pointer-events':'none'}));

      if(innerDayKey){
        for(let h=0;h<24;h++){
          const color=hourColor(innerDayKey,h)||hourColorDone(innerDayKey,h);
          if(!color)continue;
          const aS=A0+h*2*Math.PI/24, aE=A0+(h+1)*2*Math.PI/24;
          gv.appendChild(el('path',{d:annSector(cx,cy,RI1,RI2,aS,aE),fill:color,'data-date':innerDayKey}));
        }
      }
      const isThisWeek=week.days.some(d=>dateKey(d)===todayStr);
      const isSelWeek=week.days.some(d=>dateKey(d)===selDate);
      const centerFill=isSelWeek?'#1A73E8':(isThisWeek?'#4285F4':'#B0BEC5');
      const centerD=isSelWeek?new Date(selDate+'T00:00:00'):week.mon;
      const centerDk=isSelWeek?selDate:(week.days.some(d=>dateKey(d)===todayStr)?todayStr:dateKey(week.days[0]));
      gv.appendChild(el('circle',{cx,cy,r:RI1-2,fill:centerFill,'data-date':centerDk}));
      g.appendChild(gv);

      // 요일 텍스트 (링 안쪽, 필터 밖)
      days.forEach((day,di)=>{
        const dk=dateKey(day);
        const isToday=dk===todayStr;
        const catKey=dayColors(dk);
        const aS=A0+di*2*Math.PI/7, aE=A0+(di+1)*2*Math.PI/7;
        const ma=(aS+aE)/2;
        const lt=el('text',{x:cx+LRMID*Math.cos(ma),y:cy+LRMID*Math.sin(ma),
          'text-anchor':'middle','dominant-baseline':'middle',
          fill:isToday?'#1A73E8':(catKey?'white':'#90A4AE'),
          'font-size':'8','font-weight':'800','pointer-events':'none'});
        lt.textContent=KR_DAYS[di]; g.appendChild(lt);
      });

      const wt=el('text',{x:cx,y:cy,'text-anchor':'middle','dominant-baseline':'middle',
        fill:'white','font-size':'7','font-weight':'800','pointer-events':'none'});
      const isSelWeek2=week.days.some(d=>dateKey(d)===selDate);
      const centerD2=isSelWeek2?new Date(selDate+'T00:00:00'):week.mon;
      wt.textContent=`${centerD2.getMonth()+1}/${centerD2.getDate()}`;
      g.appendChild(wt);

    } else {
      // ── 브리프 모드: 중심 원 숨기고 주간 미니 파이 ──
      // 안쪽 원에 7일 파이 세그먼트
      week.days.forEach((day,di)=>{
        const dk=dateKey(day);
        const tasks=loadPlan(dk).tasks||[];
        const pending=tasks.filter(t=>!t.done).length;
        const done=tasks.filter(t=>t.done).length;
        const catKey=dayColors(dk);
        const aS=A0+di*2*Math.PI/7, aE=A0+(di+1)*2*Math.PI/7;
        const fill=catKey?CATS[catKey].color:'#E8EAF6';
        gv.appendChild(el('path',{d:annSector(cx,cy,2,RI2,aS,aE),fill,
          stroke:'rgba(255,255,255,0.5)','stroke-width':'1','pointer-events':'none'}));
      });
      g.appendChild(gv);

      // 요일 + 건수 텍스트
      week.days.forEach((day,di)=>{
        const dk=dateKey(day);
        const tasks=loadPlan(dk).tasks||[];
        const pending=tasks.filter(t=>!t.done).length;
        const catKey=dayColors(dk);
        const aS=A0+di*2*Math.PI/7, aE=A0+(di+1)*2*Math.PI/7;
        const ma=(aS+aE)/2;
        const lr2=(RO1+RO2)/2;
        // 요일
        const lt=el('text',{x:cx+lr2*Math.cos(ma),y:cy+lr2*Math.sin(ma)-4,
          'text-anchor':'middle','dominant-baseline':'middle',
          fill:catKey?'white':'#90A4AE',
          'font-size':'8','font-weight':'800','pointer-events':'none'});
        lt.textContent=KR_DAYS[di]; g.appendChild(lt);
        // 건수
        if(tasks.length){
          const nt=el('text',{x:cx+lr2*Math.cos(ma),y:cy+lr2*Math.sin(ma)+5,
            'text-anchor':'middle','dominant-baseline':'middle',
            fill:catKey?'rgba(255,255,255,0.9)':'#90A4AE',
            'font-size':'7','font-weight':'700','pointer-events':'none'});
          nt.textContent=pending?`${pending}개`:'✓'; g.appendChild(nt);
        }
        // 안쪽 파이 요일 텍스트
        const lri=RI2*0.6;
        const bt=el('text',{x:cx+lri*Math.cos(ma),y:cy+lri*Math.sin(ma),
          'text-anchor':'middle','dominant-baseline':'middle',
          fill:catKey?'rgba(255,255,255,0.8)':'rgba(144,164,174,0.8)',
          'font-size':'6.5','font-weight':'700','pointer-events':'none'});
        bt.textContent=KR_DAYS[di]; g.appendChild(bt);
      });
    }

    // 길게 누르기 감지
    let bpX=0,bpY=0,bFired=false;
    g.addEventListener('pointerdown',e=>{
      bpX=e.clientX; bpY=e.clientY; bFired=false;
      clearTimeout(currentBriefTimer);
      currentBriefTimer=setTimeout(()=>{
        bFired=true;
        briefWeek=isBrief?null:week;
        navigator.vibrate&&navigator.vibrate(40);
        renderCanvas(); applyTransform();
      },550);
    });
    g.addEventListener('pointermove',e=>{
      if(Math.hypot(e.clientX-bpX,e.clientY-bpY)>8) clearTimeout(currentBriefTimer);
    });
    g.addEventListener('pointerup',()=>clearTimeout(currentBriefTimer));
    g.addEventListener('pointercancel',()=>clearTimeout(currentBriefTimer));

    // 클릭 (길게 누르기 아닐 때만)
    g.addEventListener('click',e=>{
      e.stopPropagation();
      if(bFired){bFired=false;return;}
      clearTimeout(currentBriefTimer);
      if(isBrief){ briefWeek=null; renderCanvas(); applyTransform(); return; }
      const dk=e.target.getAttribute('data-date')||
        (week.days.some(d=>dateKey(d)===selDate)?selDate:dateKey(week.days[0]));
      zoomToDay(week,dk);
    });

    svg.appendChild(g);
  });
}

function selectDate(dk){
  selDate=dk;
  renderCanvas();
  applyTransform();
}

function zoomToMonth(mi){
  const mw=weeks.filter(w=>w.month===mi);
  if(!mw.length)return;
  const rim=RO2+20;
  const xs=mw.map(w=>w.cx);
  const cy0=mw[0].cy;
  const bL=Math.min(...xs)-rim, bR=Math.max(...xs)+rim;
  const bT=cy0-rim, bB=cy0+rim;
  const bW=bR-bL, bH=bB-bT;
  const vw=window.innerWidth, vh=window.innerHeight-60;
  const ns=Math.max(Math.min(vw/bW, vh/bH)*0.9, 0.8);
  svg.style.transition='transform .5s cubic-bezier(.4,0,.2,1)';
  scale=ns;
  panX=vw/2-(bL+bW/2)*ns;
  panY=(vh+60)/2-(bT+bH/2)*ns;
  applyTransform();
  setTimeout(()=>{ svg.style.transition=''; },550);
}

function zoomToDay(week,dk){
  const vw=window.innerWidth,vh=window.innerHeight;
  const panelH=vh*0.43;
  const availH=vh-panelH-56;
  const dia=RO2*2;
  const ts=Math.min(vw/dia,availH/dia)*0.85;
  const tx=vw/2-week.cx*ts;
  const ty=56+availH/2-week.cy*ts;
  const s0=scale,x0=panX,y0=panY;
  const dur=360,t0=performance.now();
  function ease(t){return t<.5?2*t*t:1-2*(1-t)*(1-t);}
  function frame(now){
    const p=Math.min((now-t0)/dur,1),e=ease(p);
    scale=s0+(ts-s0)*e; panX=x0+(tx-x0)*e; panY=y0+(ty-y0)*e;
    applyTransform();
    if(p<1) requestAnimationFrame(frame);
    else { dpWeek=week; selectDate(dk); openDayPanel(dk); }
  }
  requestAnimationFrame(frame);
}

function zoomToWeek(week,cb){
  const rim=RO2+12;
  const vw=window.innerWidth,vh=window.innerHeight;
  const ts=Math.min(vw/(rim*2),(vh-56)/(rim*2))*0.88;
  const tx=vw/2-week.cx*ts, ty=(vh+56)/2-week.cy*ts;
  const s0=scale,x0=panX,y0=panY;
  const dur=380,t0=performance.now();
  function ease(t){return t<.5?2*t*t:1-2*(1-t)*(1-t);}
  function frame(now){
    const p=Math.min((now-t0)/dur,1),e=ease(p);
    scale=s0+(ts-s0)*e; panX=x0+(tx-x0)*e; panY=y0+(ty-y0)*e;
    applyTransform();
    if(p<1)requestAnimationFrame(frame);
    else if(cb)cb();
  }
  requestAnimationFrame(frame);
}

function addTask(dk,title,time='',cat,prio='normal'){
  if(!title.trim()) return;
  cat=cat||selCat||'other';
  const plan=loadPlan(dk);
  plan.tasks.push({id:genId(),title:title.trim(),time,category:cat,priority:prio,alarm:'',done:false,createdAt:Date.now()});
  plan.tasks.sort((a,b)=>{
    if(a.done!==b.done)return a.done?1:-1;
    if(a.time&&b.time)return a.time<b.time?-1:1;
    if(a.time)return-1;if(b.time)return 1;return 0;
  });
  savePlan(dk,plan);
  renderSheet(dk);
  speak(`${title.trim()} 추가됐어요`);
  showToast(`"${title.trim()}" 추가됨`);
}

function speak(text){
  window.speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  u.lang='ko-KR'; u.rate=0.9; u.pitch=1.05;
  window.speechSynthesis.speak(u);
}

let recognition=null,isListening=false,vFinal='',vTimer=null;

function initVoice(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR)return;
  recognition=new SR();
  recognition.lang='ko-KR'; recognition.continuous=true; recognition.interimResults=true;
  recognition.onresult=e=>{
    if(!isListening)return;
    let interim='';
    for(let i=e.resultIndex;i<e.results.length;i++){
      if(e.results[i].isFinal)vFinal+=(vFinal?' ':'')+e.results[i][0].transcript;
      else interim+=e.results[i][0].transcript;
    }
    const disp=vFinal+(interim?(vFinal?' ':'')+interim:'');
    document.getElementById('vres').textContent=disp||'듣는 중…';
    clearTimeout(vTimer);
    vTimer=setTimeout(()=>{ const f=disp.trim(); stopV(); if(f)handleVoice(f); },2500);
  };
  recognition.onerror=e=>{ if(e.error!=='no-speech')stopV(); };
  recognition.onend=()=>{ if(isListening){try{recognition.start();}catch(_){}} };
}

function startV(){
  if(!recognition){showToast('음성 인식 미지원 브라우저');return;}
  vFinal=''; clearTimeout(vTimer); isListening=true;
  document.getElementById('vover').classList.add('on');
  document.getElementById('vres').textContent='할 일 추가 또는 "오늘 할일 알려줘"';
  document.getElementById('btn-mic').classList.add('listening');
  try{recognition.start();}catch(e){stopV();}
}
function stopV(){
  clearTimeout(vTimer); isListening=false;
  document.getElementById('vover').classList.remove('on');
  document.getElementById('btn-mic').classList.remove('listening');
  try{recognition.stop();}catch(e){}
}

// ── 음성 파싱 ────────────────────────────────────────────────
const isQ=t=>/알려줘|뭐야|뭐지|브리핑|읽어줘/.test(t);

function parseVoice(text){
  let title=text, dateOff=0, hour=null, min=0;
  if(/모레/.test(text)){dateOff=2;title=title.replace(/모레\s?/,'');}
  else if(/내일/.test(text)){dateOff=1;title=title.replace(/내일\s?/,'');}
  else title=title.replace(/오늘\s?/,'');
  const pm=/오후/.test(title),am=/오전/.test(title);
  title=title.replace(/(오전|오후)\s?/,'');
  const nm=title.match(/(\d{1,2})시\s?(\d{1,2}분?)?/);
  if(nm){ hour=parseInt(nm[1]); if(nm[2])min=parseInt(nm[2]);
    if(pm&&hour<12)hour+=12; if(am&&hour===12)hour=0;
    title=title.replace(nm[0],'').trim();
  } else {
    for(const[k,v]of Object.entries(KR_NUMS)){
      if(new RegExp(k+'시').test(title)){
        hour=pm&&v<12?v+12:v; title=title.replace(new RegExp(k+'시'),'').trim(); break;
      }
    }
    if(/아침/.test(title)){hour=8;title=title.replace(/아침\s?/,'');}
    else if(/점심/.test(title)){hour=12;title=title.replace(/점심\s?/,'');}
    else if(/저녁/.test(title)){hour=18;title=title.replace(/저녁\s?/,'');}
    else if(/밤/.test(title)){hour=21;title=title.replace(/밤\s?/,'');}
  }
  const td=new Date(today0()); td.setDate(td.getDate()+dateOff);
  let prio='normal';
  if(/중요|급해|긴급/.test(title)){prio='high';title=title.replace(/중요\s?|급해\s?|긴급\s?/g,'').trim();}
  else if(/나중에|여유/.test(title)){prio='low';title=title.replace(/나중에\s?|여유\s?/g,'').trim();}
  let cat='other';
  if(/학교|수업|과제|강의|시험|공부|상담센터/.test(title))cat='school';
  else if(/건물|관리비|임대|수리|점검|계약|청구서/.test(title))cat='manage';
  else if(/집안일|청소|요리|장보기|빨래|설거지|정리/.test(title))cat='home';
  return {title:title.trim()||text,date:dateKey(td),time:hour!==null?`${p2(hour)}:${p2(min)}`:'',cat,prio};
}

function parseMulti(text){
  const parts=text.split(/,\s*|그리고\s*|그다음에?\s*|(?:하고|먹고|마시고|마치고|끝내고|끝나고|씻고|듣고|읽고|쓰고|가고|오고|만나고|보고|운동하고|공부하고|청소하고|요리하고|빨래하고|샤워하고)\s*/);
  const segs=parts.map(s=>s.trim()).filter(s=>s.length>1);
  return segs.length?segs.map(parseVoice):[parseVoice(text)];
}

function handleVoice(text){
  if(isQ(text)){briefToday();return;}
  const list=parseMulti(text);
  list.forEach(p=>addTask(p.date,p.title,p.time,p.cat,p.prio));
  if(!sheet.classList.contains('open')) openSheet(list[0].date);
  if(list.length>1) showToast(`${list.length}개 할일 추가됨`);
}

function briefToday(){
  const dk=dateKey(today0());
  const tasks=(loadPlan(dk).tasks||[]).filter(t=>!t.done);
  const KN=['','한','두','세','네','다섯','여섯','일곱','여덟','아홉','열'];
  const cnt=n=>((n<=10?KN[n]:n)+'가지');
  function timeW(t){
    if(!t)return '';
    const[h,m]=t.split(':').map(Number);
    const ap=h<12?'오전':'오후'; const hr=h>12?h-12:h;
    return `${ap} ${hr}시`+(m===30?' 반':m>0?` ${m}분`:'')+'에 ';
  }
  if(!tasks.length){speak('오늘은 할 일이 없어요. 여유롭게 쉬세요.');return;}
  let s=`오늘 할 일은 ${cnt(tasks.length)}예요. `;
  tasks.forEach((t,i)=>{
    s+=(i===0?'':(i===tasks.length-1?'마지막으로 ':'그리고 '))+timeW(t.time)+t.title+'. ';
  });
  speak(s); showToast('브리핑 시작');
}

// ── 팬 & 줌 ─────────────────────────────────────────────────
const vp=document.getElementById('vp');
let ptrs=new Map(), dragMoved=false, tapT=0, tapX=0, tapY=0;
let lDist=0, lMidX=0, lMidY=0, pStartX=0, pStartY=0;

function applyTransform(){
  svg.style.transform=`translate(${panX}px,${panY}px) scale(${scale})`;
}

function centerToday(){
  const dk=dateKey(today0());
  const w=weeks.find(wk=>wk.days.some(d=>dateKey(d)===dk));
  if(!w)return;
  const vw=window.innerWidth, vh=window.innerHeight;
  panX=vw/2-w.cx*scale; panY=vh/2-w.cy*scale;
  applyTransform();
}

vp.addEventListener('pointerdown',e=>{
  vp.setPointerCapture(e.pointerId);
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  dragMoved=false; pStartX=e.clientX; pStartY=e.clientY;
  if(ptrs.size===2){
    const ps=[...ptrs.values()];
    lDist=Math.hypot(ps[1].x-ps[0].x,ps[1].y-ps[0].y);
    lMidX=(ps[0].x+ps[1].x)/2; lMidY=(ps[0].y+ps[1].y)/2;
  }
});

vp.addEventListener('pointermove',e=>{
  if(!ptrs.has(e.pointerId))return;
  const prev=ptrs.get(e.pointerId);
  const cur={x:e.clientX,y:e.clientY};
  ptrs.set(e.pointerId,cur);
  if(Math.hypot(cur.x-pStartX,cur.y-pStartY)>6){dragMoved=true;clearTimeout(currentBriefTimer);}

  if(ptrs.size===1){
    panX+=cur.x-prev.x; panY+=cur.y-prev.y; applyTransform();
  } else if(ptrs.size===2){
    const ps=[...ptrs.values()];
    const dist=Math.hypot(ps[1].x-ps[0].x,ps[1].y-ps[0].y);
    const midX=(ps[0].x+ps[1].x)/2, midY=(ps[0].y+ps[1].y)/2;
    const ds=dist/lDist;
    const ns=Math.min(Math.max(scale*ds,0.15),4);
    panX=midX-(midX-panX)*(ns/scale)+(midX-lMidX);
    panY=midY-(midY-panY)*(ns/scale)+(midY-lMidY);
    scale=ns; lDist=dist; lMidX=midX; lMidY=midY; applyTransform();
  }
});

vp.addEventListener('pointerup',e=>{
  ptrs.delete(e.pointerId);
  if(!dragMoved&&ptrs.size===0){
    const now=Date.now();
    if(now-tapT<320){ // 더블탭 → 확대
      const ns=Math.min(scale*2,4);
      panX=e.clientX-(e.clientX-panX)*(ns/scale);
      panY=e.clientY-(e.clientY-panY)*(ns/scale);
      scale=ns; applyTransform(); tapT=0;
    } else { tapT=now; tapX=e.clientX; tapY=e.clientY; }
  }
});
vp.addEventListener('pointercancel',e=>ptrs.delete(e.pointerId));

// ── 토스트 ───────────────────────────────────────────────────
let toastTm;
function showToast(msg){
  const el=document.getElementById('toast');
  el.textContent=msg; el.classList.add('show');
  clearTimeout(toastTm); toastTm=setTimeout(()=>el.classList.remove('show'),2500);
}

function updateLabel(){
  document.getElementById('date-label').textContent=
    new Date().toLocaleDateString('ko-KR',{year:'numeric',month:'long',day:'numeric',weekday:'short'});
}

async function initSW(){
  if(!('serviceWorker' in navigator))return;
  try{await navigator.serviceWorker.register('./sw.js');}catch(e){console.warn(e);}
}

// ── 초기화 ───────────────────────────────────────────────────
initVoice(); initSW(); updateLabel();
renderCanvas();
setTimeout(centerToday,60);
