<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>연구노트 — 빠른 인용</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --accent: #1a73e8;
            --accent-hover: #1557b0;
            --accent-light: #e8f0fe;
            --accent-mid: #d2e3fc;
            --bg: #f1f3f4;
            --surface: #ffffff;
            --border: #dadce0;
            --text-primary: #3c4043;
            --text-secondary: #5f6368;
            --text-muted: #80868b;
            --success: #1e8e3e;
            --danger: #d93025;
            --shadow: 0 1px 3px rgba(60,64,67,0.1), 0 2px 6px rgba(60,64,67,0.08);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Noto Sans KR', 'Inter', -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text-primary);
            font-size: 13px;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            padding: 8px;
            gap: 0;
        }

        .window-wrap {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--surface);
            border-radius: 16px;
            box-shadow: 0 1px 3px rgba(60,64,67,0.12), 0 4px 12px rgba(60,64,67,0.1);
            overflow: hidden;
        }

        /* ── 헤더 ── */
        .header {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 12px 14px 10px;
            flex-shrink: 0;
        }
        .header-title {
            color: var(--accent);
            font-size: 12px;
            font-weight: 700;
            letter-spacing: -0.2px;
            margin-bottom: 8px;
        }
        .search-wrap { position: relative; }
        .search-icon {
            position: absolute;
            left: 10px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 13px;
            pointer-events: none;
        }
        .search-input {
            width: 100%;
            padding: 8px 10px 8px 32px;
            background: var(--bg);
            border: 1.5px solid transparent;
            border-radius: 24px;
            font-size: 13px;
            color: var(--text-primary);
            font-family: inherit;
            transition: all 0.15s;
        }
        .search-input:focus {
            outline: none;
            border-color: var(--accent);
            background: white;
            box-shadow: 0 0 0 3px rgba(26,115,232,0.12);
        }
        .search-input::placeholder { color: var(--text-muted); }

        /* ── 탭 ── */
        .tabs {
            display: flex;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 8px 10px;
            gap: 4px;
            flex-shrink: 0;
        }
        .tab {
            flex: 1;
            padding: 7px;
            border: none;
            border-radius: 24px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.15s;
            color: var(--text-secondary);
            background: transparent;
        }
        .tab.active {
            background: var(--accent-light);
            color: var(--accent);
        }
        .tab:hover:not(.active) { background: var(--bg); color: var(--text-primary); }

        /* ── 카운트 배지 ── */
        .count-bar {
            padding: 7px 14px;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            font-size: 11.5px;
            color: var(--text-muted);
            flex-shrink: 0;
        }
        .count-bar strong { color: var(--accent); }

        /* ── 리스트 ── */
        .list-area {
            flex: 1;
            overflow-y: auto;
            padding: 8px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        /* ── 인용 카드 ── */
        .paper-item {
            background: var(--surface);
            border-radius: 14px;
            padding: 11px 12px;
            border: 1.5px solid var(--border);
            transition: all 0.15s;
            box-shadow: 0 1px 2px rgba(60,64,67,0.08);
        }
        .paper-item:hover {
            border-color: var(--accent-mid);
            box-shadow: 0 2px 8px rgba(60,64,67,0.12);
            transform: translateY(-1px);
        }

        .paper-meta {
            display: flex;
            align-items: baseline;
            gap: 6px;
            margin-bottom: 4px;
        }
        .paper-author {
            font-weight: 700;
            font-size: 12.5px;
            color: var(--text-primary);
        }
        .paper-year {
            font-size: 11px;
            font-weight: 700;
            color: var(--accent);
            background: var(--accent-light);
            padding: 1px 6px;
            border-radius: 20px;
        }
        /* ── 본문 인용 탭 안내 ── */
        .cite-hint-mini {
            flex-shrink: 0;
            padding: 8px 14px;
            background: var(--accent-light);
            border-bottom: 1px solid var(--border);
            font-size: 11px;
            color: var(--accent-hover);
            line-height: 1.5;
        }
        .cite-hint-mini b { font-weight: 700; }

        .paper-title-mini {
            font-size: 12px;
            color: var(--text-secondary);
            line-height: 1.4;
            margin-bottom: 9px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .paper-btns {
            display: flex;
            gap: 6px;
        }
        .btn-intext {
            flex: 1;
            padding: 6px 8px;
            background: #f0fdf4;
            color: #166534;
            border: 1.5px solid #86efac;
            border-radius: 6px;
            font-size: 11.5px;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
            transition: background 0.12s;
            text-align: center;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .btn-intext:hover { background: #dcfce7; }

        .btn-apa {
            flex: 1;
            padding: 6px 8px;
            background: var(--accent-light);
            color: var(--accent-hover);
            border: 1.5px solid #c7d2fe;
            border-radius: 6px;
            font-size: 11.5px;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
            transition: background 0.12s;
            text-align: center;
        }
        .btn-apa:hover { background: #e0e7ff; }

        /* ── 참고문헌 탭 ── */
        .ref-toolbar-mini {
            display: flex;
            gap: 6px;
            padding: 8px;
            flex-shrink: 0;
            border-bottom: 1px solid var(--border);
            background: var(--surface);
        }
        .btn-copy-all-mini {
            flex: 1;
            padding: 8px;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 7px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
            transition: background 0.15s;
        }
        .btn-copy-all-mini:hover { background: var(--accent-hover); }

        .ref-item-mini {
            background: var(--surface);
            border-radius: 9px;
            padding: 11px 12px;
            border: 1.5px solid transparent;
            display: flex;
            align-items: flex-start;
            gap: 8px;
            box-shadow: var(--shadow);
            transition: all 0.12s;
        }
        .ref-item-mini.selected { border-color: #86efac; background: #f0fdf4; }
        .ref-item-mini:not(.selected) { opacity: 0.5; }

        .ref-checkbox {
            margin-top: 2px;
            width: 15px;
            height: 15px;
            flex-shrink: 0;
            accent-color: var(--accent);
            cursor: pointer;
        }
        .ref-text-mini {
            font-size: 11.5px;
            line-height: 1.65;
            color: var(--text-primary);
            flex: 1;
        }
        .btn-ref-copy-mini {
            padding: 4px 8px;
            background: var(--bg);
            color: var(--text-secondary);
            border: 1.5px solid var(--border);
            border-radius: 5px;
            font-size: 11px;
            cursor: pointer;
            font-family: inherit;
            white-space: nowrap;
            flex-shrink: 0;
            transition: all 0.12s;
        }
        .btn-ref-copy-mini:hover { background: var(--accent-light); border-color: var(--accent); color: var(--accent); }

        /* ── 빈 상태 ── */
        .empty {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            text-align: center;
            color: var(--text-muted);
            flex: 1;
        }
        .empty-icon { font-size: 36px; margin-bottom: 10px; }
        .empty h3 { font-size: 14px; color: var(--text-secondary); margin-bottom: 6px; }
        .empty p { font-size: 12px; line-height: 1.6; }

        /* ── 토스트 ── */
        .toast {
            position: fixed;
            bottom: 16px;
            left: 50%;
            transform: translateX(-50%);
            padding: 9px 16px;
            border-radius: 8px;
            font-size: 12.5px;
            font-weight: 500;
            color: white;
            z-index: 9999;
            animation: slideUp 0.2s ease;
            white-space: nowrap;
            box-shadow: 0 4px 16px rgba(0,0,0,0.2);
        }
        .toast-success { background: var(--success); }
        .toast-error { background: var(--danger); }
        .toast-info { background: var(--accent); }
        @keyframes slideUp {
            from { transform: translateX(-50%) translateY(10px); opacity: 0; }
            to { transform: translateX(-50%) translateY(0); opacity: 1; }
        }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }
    </style>
</head>
<body>

    <div class="window-wrap">
        <div class="header">
            <div class="header-title">
            <svg style="vertical-align:middle;margin-right:6px" width="22" height="22" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
                <defs><linearGradient id="mg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#4285f4"/><stop offset="100%" stop-color="#1a73e8"/></linearGradient></defs>
                <rect width="36" height="36" rx="10" fill="url(#mg)"/>
                <rect x="7" y="6" width="13" height="17" rx="2.5" fill="white"/>
                <rect x="10" y="10" width="7" height="1.5" rx="0.75" fill="#1a73e8" opacity="0.3"/>
                <rect x="10" y="13" width="5.5" height="1.5" rx="0.75" fill="#1a73e8" opacity="0.3"/>
                <rect x="10" y="16" width="6.5" height="1.5" rx="0.75" fill="#1a73e8" opacity="0.3"/>
                <circle cx="26" cy="11" r="2.2" fill="white"/>
                <circle cx="29" cy="21" r="2" fill="white" opacity="0.85"/>
                <circle cx="22" cy="27" r="1.8" fill="white" opacity="0.75"/>
                <line x1="20" y1="12.5" x2="23.9" y2="11.5" stroke="white" stroke-width="1.3" stroke-linecap="round" opacity="0.85"/>
                <line x1="27.2" y1="13.8" x2="28.4" y2="19.2" stroke="white" stroke-width="1.3" stroke-linecap="round" opacity="0.75"/>
                <line x1="27.8" y1="23" x2="24" y2="26" stroke="white" stroke-width="1.3" stroke-linecap="round" opacity="0.65"/>
            </svg>
            연구노트 — 빠른 인용
        </div>
            <div class="search-wrap">
                <span class="search-icon"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg></span>
                <input type="text" id="search" class="search-input" placeholder="저자, 제목, 변인 검색...">
            </div>
        </div>

        <div id="count-bar" class="count-bar"></div>

        <div class="cite-hint-mini">✓ 메인 앱 논문 목록에서 <b>‘빠른 인용’ 체크</b>한 논문만 표시됩니다</div>
        <div class="ref-toolbar-mini">
            <button class="btn-copy-all-mini" id="btn-copy-all-refs"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px" aria-hidden="true"><rect width="8" height="4" x="8" y="2" rx="1" ry="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/></svg> 참고문헌 전체 복사</button>
        </div>
        <div class="list-area" id="cite-list-area"></div>
    </div>

    <script>
    // 창 크기 강제 지정 (window.open 크기 지정이 무시될 때 대비)
    window.resizeTo(300, 600);

    // ── DB (메인 앱과 동일) ──────────────────────────────────
    const DB_NAME = 'ResearchNotesDB';
    let db, papers = [], searchQuery = '';

    function initDB() {
        return new Promise((res, rej) => {
            // 버전을 지정하지 않고 현재 버전 그대로 연다 (메인 앱과 버전 충돌 방지)
            const req = indexedDB.open(DB_NAME);
            req.onsuccess = e => { db = e.target.result; res(); };
            req.onerror = e => rej(e.target.error);
        });
    }

    function dbGetAll() {
        return new Promise((res, rej) => {
            const req = db.transaction('papers', 'readonly').objectStore('papers').getAll();
            req.onsuccess = () => res(req.result);
            req.onerror = () => rej(req.error);
        });
    }

    function dbPut(item) {
        return new Promise((res, rej) => {
            const req = db.transaction('papers', 'readwrite').objectStore('papers').put(item);
            req.onsuccess = () => res();
            req.onerror = () => rej(req.error);
        });
    }

    async function copyToClipboard(text) {
        try { await navigator.clipboard.writeText(text); return true; }
        catch { return false; }
    }

    function escHtml(str) {
        if (!str) return '';
        return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    // ── APA 형식 ────────────────────────────────────────────
    // ── APA 7판 ────────────────────────────────────────────
    // ⚠️ app.js에도 같은 로직이 있다(이 창은 단독 실행이라 일부러 복사본을 둔다).
    //    한쪽을 고치면 다른 쪽도 같이 고칠 것.
    const isKoreanName = s => /[가-힣]/.test(s);

    function splitAuthors(raw) {
        let s = String(raw || '').trim();
        if (!s) return [];
        s = s.replace(/\s+and\s+/gi, ' & ');
        if (s.includes(';')) return s.split(';').map(x => x.trim()).filter(Boolean);

        // 한국어 이름 — 쉼표·가운뎃점으로 나누되, "반두라, A." 처럼 이니셜만 있는 조각은
        // 앞 이름에 도로 붙인다(외국 저자를 한글로 옮겨 적은 경우).
        if (isKoreanName(s)) {
            const ko = s.split(/[,·&]+/).map(x => x.trim()).filter(Boolean);
            const merged = [];
            for (let i = 0; i < ko.length; i++) {
                const next = ko[i + 1];
                if (next && /^(?:[A-Za-z]\.?\s*){1,3}$/.test(next)) { merged.push(`${ko[i]}, ${next}`); i++; }
                else merged.push(ko[i]);
            }
            return merged;
        }

        // 영문: 쉼표로 자른 뒤, "이니셜만 있는 조각"은 앞 조각(성)에 도로 붙인다
        const parts = s.split(/[,&]/).map(x => x.trim()).filter(Boolean);
        const out = [];
        for (let i = 0; i < parts.length; i++) {
            const next = parts[i + 1];
            if (next && /^(?:[A-Z]\.?\s*){1,3}$/.test(next)) {
                out.push(`${parts[i]}, ${next}`);
                i++;
            } else {
                out.push(parts[i]);
            }
        }
        return out;
    }

    function apaAuthorName(name) {
        const n = String(name || '').trim().replace(/\s+/g, ' ');
        if (!n) return '';
        if (isKoreanName(n)) return n;
        const initials = arr => arr.map(w => w.replace(/[^A-Za-z]/g, '').charAt(0))
            .filter(Boolean).map(c => c.toUpperCase() + '.').join(' ');
        if (n.includes(',')) {
            const [last, rest = ''] = n.split(',').map(x => x.trim());
            const given = rest.split(/\s+/).filter(Boolean);
            return given.length ? `${last}, ${initials(given)}` : last;
        }
        const words = n.split(' ').filter(Boolean);
        if (words.length === 1) return words[0];
        const last = words.pop();
        return `${last}, ${initials(words)}`;
    }

    function apaAuthorList(raw) {
        const people = splitAuthors(raw).map(apaAuthorName).filter(Boolean);
        if (!people.length) return '';
        const korean = isKoreanName(people[0]);
        if (people.length === 1) return people[0];
        let list = people, ellipsis = false;
        if (people.length > 20) { list = people.slice(0, 19).concat([people[people.length - 1]]); ellipsis = true; }
        const head = list.slice(0, -1).join(', ');
        const tail = list[list.length - 1];
        if (ellipsis) return `${head}, ... ${tail}`;
        return korean ? `${head}, ${tail}` : `${head}, & ${tail}`;
    }

    function apaItemType(paper) {
        if (paper.itemType) return paper.itemType;
        const hint = `${paper.analysis?.paperType || ''} ${paper.source || ''}`;
        if (/학위논문|석사|박사|dissertation|thesis/i.test(hint)) return 'thesis';
        return 'journal';
    }

    function apaEditors(raw) {
        const people = splitAuthors(raw);
        if (!people.length) return '';
        const korean = isKoreanName(people[0]);
        if (korean) return `${people.join(', ')} (편)`;
        // 편저자는 이름이 성 앞에 온다: "J. Smith"
        const flip = n => {
            const a = apaAuthorName(n);
            const [last, init = ''] = a.split(',').map(x => x.trim());
            return init ? `${init} ${last}` : last;
        };
        const list = people.map(flip);
        const joined = list.length === 1 ? list[0]
            : `${list.slice(0, -1).join(', ')}${list.length > 2 ? ',' : ''} & ${list[list.length - 1]}`;
        return `${joined} (${list.length > 1 ? 'Eds.' : 'Ed.'})`;
    }

    let _apaSuffix = {};

    function apaYearSuffixes(papers) {
        const groups = {};
        (papers || []).forEach(p => {
            if (!p.year) return;
            const first = splitAuthors(p.authors)[0] || '';
            const key = `${apaAuthorName(first)}|${p.year}`;
            (groups[key] = groups[key] || []).push(p);
        });
        const out = {};
        Object.values(groups).forEach(list => {
            if (list.length < 2) return;
            // 제목 순으로 정렬해 a, b, c … (APA 규칙)
            list.slice().sort((a, b) => String(a.title || '').localeCompare(String(b.title || ''), 'ko'))
                .forEach((p, i) => { out[p.id] = String.fromCharCode(97 + i); });
        });
        return out;
    }

    const APA_PROPER = new Set([
        'korea','korean','china','chinese','japan','japanese','taiwan','vietnam',
        'america','american','europe','european','asia','asian','africa','african',
        'australia','australian','britain','british','england','english','france','french',
        'germany','german','spain','spanish','italy','italian','russia','russian',
        'india','indian','canada','canadian','mexico','brazil','netherlands','sweden','norway','finland',
        'seoul','busan','tokyo','beijing','shanghai','london','paris','berlin','york','washington',
        'january','february','march','april','may','june','july',
        'august','september','october','november','december',
        'monday','tuesday','wednesday','thursday','friday','saturday','sunday',
        'covid','covid-19','hiv','aids','oecd','unesco','who','un',
        'facebook','instagram','twitter','youtube','google','tiktok','kakaotalk',
        'christian','christianity','buddhist','buddhism','muslim','islam','confucian',
    ]);

    function toSentenceCase(str) {
        const s = String(str || '').trim();
        if (!s || /[가-힣]/.test(s)) return s;   // 한글 제목은 그대로

        let capNext = true;
        return s.split(/(\s+)/).map(tok => {
            if (/^\s+$/.test(tok)) return tok;

            const bare = tok.replace(/[^A-Za-z0-9-]/g, '');
            const letters = tok.replace(/[^A-Za-z]/g, '');
            const isAcronym = letters.length > 1 && letters === letters.toUpperCase();  // APA, PTSD
            const isMixed   = /[a-z][A-Z]/.test(tok);                                    // iPhone
            const isProper  = APA_PROPER.has(bare.toLowerCase());                        // Korea

            let out;
            if (isAcronym || isMixed) out = tok;
            else if (isProper)        out = tok.charAt(0).toUpperCase() + tok.slice(1).toLowerCase();
            else if (capNext)         out = tok.charAt(0).toUpperCase() + tok.slice(1).toLowerCase();
            else                      out = tok.toLowerCase();

            capNext = /[:.?!]$/.test(tok);   // 콜론·마침표 뒤는 다시 대문자
            return out;
        }).join('');
    }

    function formatAPAParts(paper, suffix) {
        const sfx = suffix || _apaSuffix[paper.id] || '';
        const authors   = apaAuthorList(paper.authors) || '저자 미상';
        const year      = paper.year ? `(${paper.year}${sfx})` : `(연도 미상)`;
        // APA: 논문·책·학위논문 제목은 문장식. 저장값은 안 바꾸고 여기서만 변환한다.
        const title     = toSentenceCase((paper.title || '제목 없음').trim().replace(/\.$/, ''));
        const source    = (paper.source || '').trim();
        const volume    = (paper.volume || '').trim();
        const issue     = (paper.issue || '').trim();
        const pages     = (paper.pages || '').trim().replace(/[-–—~]/g, '–');   // APA는 en dash
        const publisher = (paper.publisher || '').trim();
        const bookTitle = toSentenceCase((paper.bookTitle || '').trim());
        const edition   = (paper.edition || '').trim();
        const url       = (paper.url || '').trim();
        const translator= (paper.translator || '').trim();
        const origYear  = (paper.originalYear || '').trim();
        const doiRaw    = (paper.doi || '').trim();
        const doi = doiRaw ? `https://doi.org/${doiRaw.replace(/^https?:\/\/doi\.org\//i, '')}` : '';

        const type   = apaItemType(paper);
        const korean = /[가-힣]/.test(`${authors}${title}`);
        const IT = t => `<i style="font-style:italic">${t}</i>`;   // 기울임
        const E  = escHtml;

        let text = `${authors} ${year}. `;
        let html = `${E(authors)} ${E(year)}. `;

        if (type === 'thesis') {
            // 저자 (연도). 제목(기울임) [석사학위논문, 기관].
            const hint = `${paper.analysis?.paperType || ''} ${source}`;
            const degree = /박사|doctor/i.test(hint) ? '박사학위논문' : '석사학위논문';
            // "○○대학교 대학원 석사학위논문"이 통째로 들어있으면 학위 표기는 떼고 기관만 남긴다
            const inst = source.replace(/\s*(석사|박사)?\s*학위\s*논문\s*/g, '').trim();
            text += `${title} [${degree}${inst ? `, ${inst}` : ''}].`;
            html += `${IT(E(title))} [${degree}${inst ? `, ${E(inst)}` : ''}].`;

        } else if (type === 'book') {
            // 저자 (연도). 제목(기울임) (판). 출판사.
            text += `${title}`;
            html += `${IT(E(title))}`;
            if (edition) { text += ` (${edition})`; html += ` (${E(edition)})`; }
            text += '.'; html += '.';
            if (publisher) { text += ` ${publisher}.`; html += ` ${E(publisher)}.`; }

        } else if (type === 'chapter') {
            // 저자 (연도). 장 제목. 편저자 (편), 책제목(기울임) (판, pp. 쪽). 출판사.
            const eds = apaEditors(paper.editors);
            const inWord = korean ? '' : 'In ';
            text += `${title}. `;
            html += `${E(title)}. `;
            if (eds) { text += `${inWord}${eds}, `; html += `${inWord}${E(eds)}, `; }
            text += `${bookTitle || source}`;
            html += `${IT(E(bookTitle || source))}`;
            const paren = [edition, pages ? `pp. ${pages}` : ''].filter(Boolean).join(', ');
            if (paren) { text += ` (${paren})`; html += ` (${E(paren)})`; }
            text += '.'; html += '.';
            if (publisher) { text += ` ${publisher}.`; html += ` ${E(publisher)}.`; }

        } else if (type === 'translation') {
            // APA 7 번역서: 원저자 (번역출판연도). 제목(기울임) (역자 역). 출판사. (원저 원년 출판)
            // 본문 인용은 (원저자, 원년/번역년) — formatInText 가 처리한다.
            text += `${title}`;
            html += `${IT(E(title))}`;
            if (edition) { text += ` (${edition})`; html += ` (${E(edition)})`; }
            if (translator) {
                const t = korean ? `${translator} 역` : `${translator}, Trans.`;
                text += ` (${t})`; html += ` (${E(t)})`;
            }
            text += '.'; html += '.';
            if (publisher) { text += ` ${publisher}.`; html += ` ${E(publisher)}.`; }
            if (origYear) {
                const o = korean ? `(원저 ${origYear} 출판)` : `(Original work published ${origYear})`;
                text += ` ${o}`; html += ` ${E(o)}`;
            }

        } else if (type === 'web') {
            // 저자/기관 (연도). 제목(기울임). 발행처. URL
            text += `${title}.`;
            html += `${IT(E(title))}.`;
            if (publisher) { text += ` ${publisher}.`; html += ` ${E(publisher)}.`; }

        } else {
            // 학술지 논문: 저자 (연도). 제목. 학술지명(기울임), 권(기울임)(호), 쪽.
            text += `${title}.`;
            html += `${E(title)}.`;
            if (source) {
                text += ` ${source}`;
                html += ` ${IT(E(source))}`;
                if (volume) {
                    text += `, ${volume}${issue ? `(${issue})` : ''}`;
                    html += `, ${IT(E(volume))}${issue ? `(${E(issue)})` : ''}`;
                }
                if (pages) { text += `, ${pages}`; html += `, ${E(pages)}`; }
                text += '.'; html += '.';
            }
        }

        // DOI가 있으면 DOI를, 없으면 URL을 끝에 붙인다 (APA 7: 둘 다 쓰지 않는다)
        const tail = doi || url;
        if (tail) { text += ` ${tail}`; html += ` ${E(tail)}`; }
        return { text, html };
    }

    const formatAPA = p => formatAPAParts(p).text;

    // 기울임까지 살려서 복사 (한글·워드에 붙여넣으면 서식 유지)
    // app.js 의 copyRich 와 같은 로직 (이 창은 단독 실행이라 복사본을 둔다)
    async function copyRich(html, text) {
        try {
            const holder = document.createElement('div');
            holder.setAttribute('contenteditable', 'true');
            holder.innerHTML = html;
            holder.style.cssText = 'position:fixed;left:-9999px;top:0;white-space:pre-wrap;opacity:0';
            document.body.appendChild(holder);
            const sel = window.getSelection();
            const range = document.createRange();
            range.selectNodeContents(holder);
            sel.removeAllRanges();
            sel.addRange(range);
            const ok = document.execCommand('copy');
            sel.removeAllRanges();
            holder.remove();
            if (ok) return true;
        } catch {}
        try {
            if (navigator.clipboard?.write && window.ClipboardItem) {
                await navigator.clipboard.write([new ClipboardItem({
                    'text/html':  new Blob([html], { type: 'text/html' }),
                    'text/plain': new Blob([text], { type: 'text/plain' }),
                })]);
                return true;
            }
        } catch {}
        return copyToClipboard(text);
    }

    function formatInText(paper) {
        if (!paper.authors) return paper.year ? `(${paper.year})` : '';
        const people = splitAuthors(paper.authors);
        if (!people.length) return paper.year ? `(${paper.year})` : '';

        const korean = isKoreanName(people[0]);
        // 본문 인용은 성(姓)만 쓴다
        // 본문 인용은 성(姓)만. "반두라, A." 처럼 외국 저자를 한글로 옮긴 경우도 쉼표 앞만 쓴다.
        const surname = p => apaAuthorName(p).split(',')[0].trim();
        // 번역서는 APA 7 규칙상 (원저자, 원출판연도/번역출판연도) 로 쓴다
        const _oy = (paper.originalYear || '').trim();
        const _base = apaItemType(paper) === 'translation' && _oy && paper.year
            ? `${_oy}/${paper.year}` : (paper.year || '');
        const year = _base ? `${_base}${_apaSuffix[paper.id] || ''}` : '';

        let name;
        if (people.length === 1)      name = surname(people[0]);
        else if (people.length === 2) name = korean ? `${surname(people[0])}, ${surname(people[1])}`
                                                    : `${surname(people[0])} & ${surname(people[1])}`;
        else                          name = korean ? `${surname(people[0])} 외`
                                                    : `${surname(people[0])} et al.`;

        return year ? `(${name}, ${year})` : `(${name})`;
    }

    // ── 토스트 ────────────────────────────────────────────
    function showToast(msg, type = 'info') {
        document.querySelector('.toast')?.remove();
        const t = document.createElement('div');
        t.className = `toast toast-${type}`;
        t.textContent = msg;
        document.body.appendChild(t);
        setTimeout(() => t.remove(), 2500);
    }

    // ── 렌더링 ───────────────────────────────────────────
    function getFiltered() {
        const q = searchQuery.toLowerCase();
        if (!q) return papers;
        return papers.filter(p =>
            [p.title, p.authors, p.abstract, ...(p.variables||[]), ...(p.tags||[])]
            .some(f => f && String(f).toLowerCase().includes(q))
        );
    }

    function render() {
        _apaSuffix = apaYearSuffixes(papers);
        // 참고문헌 화면과 같은 목록을 보여준다.
        // 예전엔 inQuickCite(별표) 체크한 것만 보여서, 체크를 안 하면 창이 비어 있었다.
        const selectedCount = papers.filter(p => p.inReferences).length;

        const list = getFiltered().sort((a, b) => {
            const na = (a.authors||'').split(/[,·]/)[0].trim();
            const nb = (b.authors||'').split(/[,·]/)[0].trim();
            return na.localeCompare(nb, 'ko');
        });

        const countBar = document.getElementById('count-bar');
        countBar.innerHTML = `전체 <strong>${papers.length}편</strong>${selectedCount ? ` · 참고문헌 선택 ${selectedCount}편` : ''}${searchQuery ? ` · 검색 ${list.length}편` : ''}`;

        // 참고문헌 전체 복사 버튼 (현재 표시된 선택 논문 기준)
        document.getElementById('btn-copy-all-refs').onclick = async () => {
            if (!list.length) { showToast('표시된 논문이 없습니다', 'error'); return; }
            const parts = list.map(formatAPAParts);
            const text = parts.map(x => x.text).join('\n\n');
            // 기울임을 살리려면 HTML도 함께 실어야 한다 (내어쓰기까지 적용)
            const html = `<div>${parts.map(x =>
                `<p style="margin:0 0 10px;text-indent:-2em;padding-left:2em">${x.html}</p>`).join('')}</div>`;
            const ok = await copyRich(html, text);
            showToast(ok ? `${list.length}편 복사됨 — 한글에 「골라 붙이기 → HTML 형식」` : '복사 실패', ok ? 'success' : 'error');
        };

        const panel = document.getElementById('cite-list-area');

        if (list.length === 0) {
            if (!searchQuery) {
                panel.innerHTML = `
                    <div class="empty">
                        <div class="empty-icon">📚</div>
                        <h3>저장된 논문이 없습니다</h3>
                        <p>메인 앱에서 논문을 추가하면<br>여기에 바로 나타납니다</p>
                    </div>`;
            } else {
                panel.innerHTML = `
                    <div class="empty">
                        <div class="empty-icon"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="opacity:.6" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg></div>
                        <h3>결과 없음</h3>
                        <p>다른 키워드로 검색해보세요</p>
                    </div>`;
            }
            return;
        }

        panel.innerHTML = list.map(p => {
            const intext = formatInText(p);
            const firstAuthor = (p.authors || '').split(/[,·]/)[0].trim();
            return `
                <div class="paper-item">
                    <div class="paper-meta">
                        <span class="paper-author">${escHtml(firstAuthor || '저자 미상')}</span>
                        ${p.year ? `<span class="paper-year">${escHtml(p.year)}</span>` : ''}
                    </div>
                    <div class="paper-title-mini">${escHtml(p.title || '제목 없음')}</div>
                    <div class="paper-btns">
                        <button class="btn-intext" data-intext="${escHtml(intext)}">${intext ? escHtml(intext) : '본문 인용 복사'}</button>
                        <button class="btn-apa" data-id="${p.id}">참고문헌 복사</button>
                    </div>
                </div>`;
        }).join('');

        panel.querySelectorAll('.btn-intext').forEach(btn => {
            btn.addEventListener('click', async () => {
                const intext = btn.dataset.intext;
                if (!intext) { showToast('저자·연도가 없어 본문 인용을 만들 수 없습니다', 'error'); return; }
                const ok = await copyToClipboard(intext);
                showToast(ok ? `${intext} 복사됨` : '복사 실패', ok ? 'success' : 'error');
            });
        });

        panel.querySelectorAll('.btn-apa').forEach(btn => {
            btn.addEventListener('click', async () => {
                const p = papers.find(x => x.id === btn.dataset.id);
                if (!p) return;
                const { text, html } = formatAPAParts(p);
                const ok = await copyRich(html, text);
                showToast(ok ? 'APA 참고문헌 복사됨 (기울임 포함)' : '복사 실패', ok ? 'success' : 'error');
            });
        });
    }

    // ── 검색 ────────────────────────────────────────────
    document.getElementById('search').addEventListener('input', e => {
        searchQuery = e.target.value.trim();
        render();
    });

    // ── 주기적 데이터 새로고침 (메인 앱에서 추가하면 반영) ──
    async function refresh() {
        papers = await dbGetAll();
        render();
    }

    // ── 시작 ────────────────────────────────────────────
    async function init() {
        await initDB();
        papers = await dbGetAll();
        render();

        // 30초마다 자동 갱신 (메인 앱에서 추가한 논문 반영)
        setInterval(refresh, 30000);
    }

    init().catch(console.error);
    </script>
</body>
</html>
