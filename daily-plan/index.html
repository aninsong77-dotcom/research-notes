<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#4285f4">
<title>일일계획</title>
<link rel="manifest" href="manifest.json">
<style>
:root {
    --bg: #fffde7;
    --surface: #ffffff;
    --border: #fff9c4;
    --text: #37474f;
    --text-sub: #546e7a;
    --text-muted: #90a4ae;
    --danger: #e53935;
    --success: #43a047;
    --warn: #fb8c00;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bot: env(safe-area-inset-bottom, 0px);
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

body {
    font-family: 'Apple SD Gothic Neo', 'Noto Sans KR', -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100dvh;
    overscroll-behavior: none;
}

/* ── 상단바 ── */
.topbar {
    position: sticky; top: 0; z-index: 100;
    background: linear-gradient(135deg, #0288d1 0%, #26c6da 100%);
    color: white;
    padding: calc(var(--safe-top) + 10px) 16px 12px;
    display: flex; align-items: center; gap: 8px;
    box-shadow: 0 3px 0 rgba(0,0,0,.12);
}
.topbar-title { font-size: 18px; font-weight: 800; flex: 1; letter-spacing: -.3px; }
.btn-notif {
    background: rgba(255,255,255,.25); border: none; border-radius: 50%;
    width: 38px; height: 38px; color: white; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
}
.btn-notif:active { background: rgba(255,255,255,.4); }

/* ── 날짜 네비 ── */
.date-nav {
    background: var(--surface);
    padding: 12px 16px 10px;
    display: flex; align-items: center; gap: 8px;
    border-bottom: 3px solid var(--bg);
}
.nav-btn {
    width: 40px; height: 40px; border: none; border-radius: 50%;
    background: #e1f5fe; font-size: 22px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    color: #0277bd; flex-shrink: 0;
}
.nav-btn:active { background: #b3e5fc; }
.date-center { flex: 1; text-align: center; }
.date-weekday { font-size: 12px; color: var(--text-muted); }
.date-main { font-size: 17px; font-weight: 800; margin-top: 2px; display: flex; align-items: center; justify-content: center; gap: 6px; }
.today-chip {
    font-size: 10px; font-weight: 800;
    background: #ffd600; color: #5d4037;
    border-radius: 99px; padding: 2px 8px;
}
.btn-today {
    font-size: 12px; font-weight: 700;
    color: #0277bd; border: 2px solid #0277bd;
    background: #e1f5fe; border-radius: 20px;
    padding: 6px 12px; cursor: pointer; flex-shrink: 0;
}

/* ── 진행률 ── */
.progress-bar-wrap {
    background: var(--surface);
    padding: 10px 16px 12px;
    border-bottom: 3px solid var(--bg);
    display: none;
}
.progress-bar-track { height: 10px; background: #f5f5f5; border-radius: 99px; overflow: hidden; }
.progress-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, #42a5f5, #66bb6a, #ffa726);
    border-radius: 99px; transition: width .4s ease;
}
.progress-text { font-size: 12px; color: var(--text-muted); margin-top: 5px; text-align: right; font-weight: 600; }

/* ── 스크롤 영역 ── */
.scroll-area { padding: 10px 12px 200px; display: flex; flex-direction: column; gap: 10px; }

/* ── 태스크 카드 ── */
.task-card {
    background: var(--surface);
    border-radius: 16px;
    padding: 11px 12px;
    display: flex; align-items: center; gap: 10px;
    box-shadow: 0 2px 8px rgba(0,0,0,.07);
    border-left: 6px solid var(--cc, #b0bec5);
    transition: opacity .2s;
    position: relative;
}
.task-card.done { opacity: .5; }

.cat-icon-wrap {
    width: 42px; height: 42px; border-radius: 12px;
    background: var(--cb, #f5f5f5);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
}

.check-btn {
    width: 28px; height: 28px;
    border: 2.5px solid #cfd8dc; border-radius: 50%;
    background: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; color: transparent; transition: all .15s;
}
.check-btn:active { transform: scale(.88); }
.check-btn.checked { background: var(--cc, #039be5); border-color: var(--cc, #039be5); color: white; }

.task-body { flex: 1; min-width: 0; }
.task-title-inp {
    width: 100%; border: none; outline: none;
    font-size: 15px; font-weight: 600; font-family: inherit;
    color: var(--text); background: transparent; line-height: 1.4; padding: 0;
}
.task-title-inp:disabled { text-decoration: line-through; color: var(--text-muted); font-weight: 400; }

.task-meta { display: flex; align-items: center; flex-wrap: wrap; gap: 5px; margin-top: 5px; }
.meta-chip {
    font-size: 11px; font-weight: 700; border-radius: 8px; padding: 2px 8px;
    display: flex; align-items: center; gap: 3px;
}
.chip-time   { background: #e1f5fe; color: #0277bd; }
.chip-alarm  { background: #fce4ec; color: #c62828; }
.chip-prio-high   { background: #fce4ec; color: #c62828; }
.chip-prio-normal { background: #e8f5e9; color: #2e7d32; }
.chip-prio-low    { background: #f5f5f5; color: var(--text-muted); }

.btn-del-task {
    background: none; border: none; color: #cfd8dc;
    cursor: pointer; padding: 4px; border-radius: 8px; flex-shrink: 0;
    opacity: 0; transition: opacity .15s;
}
.task-card:active .btn-del-task,
.task-card.show-del .btn-del-task { opacity: 1; }

/* ── 완료 섹션 ── */
.done-header {
    display: flex; align-items: center; gap: 8px; padding: 4px 8px;
    cursor: pointer; color: var(--text-muted);
    font-size: 13px; font-weight: 700; user-select: none;
}
.done-arrow { transition: transform .2s; }
.done-arrow.open { transform: rotate(90deg); }
.done-list { display: none; flex-direction: column; gap: 10px; }
.done-list.open { display: flex; }

/* ── 빈 상태 ── */
.empty-state { text-align: center; padding: 40px 24px; color: var(--text-muted); }
.empty-icon { margin-bottom: 14px; }
.empty-text { font-size: 15px; line-height: 2; font-weight: 600; }

/* ── 하단 고정 입력창 ── */
.bottom-bar {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 200;
    background: var(--surface);
    border-top: 3px solid var(--bg);
    padding: 12px 14px calc(var(--safe-bot) + 12px);
    box-shadow: 0 -4px 20px rgba(0,0,0,.08);
}
.add-row { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
.add-input {
    flex: 1; border: 2px solid var(--bg); border-radius: 16px;
    padding: 11px 14px; font-size: 15px; font-family: inherit;
    color: var(--text); background: var(--bg); outline: none; transition: border-color .15s;
}
.add-input:focus { border-color: #29b6f6; background: white; }
.add-input::-webkit-search-cancel-button, .add-input::-webkit-search-decoration { display: none; }

.btn-mic {
    width: 48px; height: 48px; border-radius: 50%; border: none;
    background: linear-gradient(135deg, #f4511e, #ffa000);
    color: white; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; box-shadow: 0 3px 10px rgba(244,81,30,.4);
    transition: transform .15s;
}
.btn-mic:active { transform: scale(.9); }
.btn-mic.listening { background: #e53935; animation: pulse 1s infinite; }
@keyframes pulse {
    0%,100% { box-shadow: 0 0 0 0 rgba(229,57,53,.4); }
    50%      { box-shadow: 0 0 0 10px rgba(229,57,53,.0); }
}
.btn-add-text {
    width: 48px; height: 48px; border-radius: 50%; border: none;
    background: linear-gradient(135deg, #0288d1, #26c6da);
    color: white; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; box-shadow: 0 3px 10px rgba(2,136,209,.4);
}
.btn-add-text:active { transform: scale(.9); }

.options-row {
    display: flex; gap: 6px; align-items: center;
    overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch;
}
.options-row::-webkit-scrollbar { display: none; }
.opt-input {
    border: 2px solid var(--bg); border-radius: 10px; padding: 7px 8px;
    font-size: 13px; font-weight: 700; background: var(--bg);
    color: var(--text-sub); cursor: pointer; outline: none; font-family: inherit;
}
.opt-label { font-size: 11px; color: var(--text-muted); font-weight: 700; white-space: nowrap; }

/* ── 음성 오버레이 ── */
.voice-overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(1,87,155,.88); z-index: 500;
    flex-direction: column; align-items: center; justify-content: center; gap: 20px;
}
.voice-overlay.active { display: flex; }
.voice-circle {
    width: 120px; height: 120px; border-radius: 50%;
    background: linear-gradient(135deg, #f4511e, #ffa000);
    display: flex; align-items: center; justify-content: center;
    animation: pulse 1s infinite;
}
.voice-text { color: white; font-size: 17px; font-weight: 800; }
.voice-result { color: rgba(255,255,255,.9); font-size: 15px; min-height: 24px; padding: 0 32px; text-align: center; }
.btn-voice-cancel {
    background: rgba(255,255,255,.2); border: 2px solid rgba(255,255,255,.5);
    color: white; border-radius: 24px; padding: 10px 28px;
    font-size: 15px; font-weight: 700; cursor: pointer; margin-top: 8px;
}

/* ── 토스트 ── */
.toast {
    position: fixed; bottom: 90px; left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: #37474f; color: white; border-radius: 24px;
    padding: 10px 20px; font-size: 14px; font-weight: 700;
    z-index: 600; opacity: 0; transition: opacity .25s, transform .25s;
    white-space: nowrap; pointer-events: none;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ── 알림 패널 ── */
.alarm-panel { display: none; }
.alarm-panel.open { display: flex; }

/* ── 카테고리 탭 ── */
.cat-tabs {
    background: var(--surface); padding: 8px 12px;
    display: flex; gap: 6px; border-bottom: 3px solid var(--bg);
    overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch;
}
.cat-tabs::-webkit-scrollbar { display: none; }
.cat-tab {
    border: 2px solid transparent; border-radius: 14px; padding: 6px 13px;
    font-size: 13px; font-weight: 800; font-family: inherit; cursor: pointer;
    white-space: nowrap; background: var(--bg); color: var(--text-sub);
    flex-shrink: 0; transition: all .15s;
    display: flex; align-items: center; gap: 5px;
}
.cat-tab.active                    { color: white; }
.cat-tab.active[data-cat="all"]    { background: #0288d1; }
.cat-tab.active[data-cat="school"] { background: #1565c0; }
.cat-tab.active[data-cat="manage"] { background: #e65100; }
.cat-tab.active[data-cat="home"]   { background: #2e7d32; }
.cat-tab.active[data-cat="other"]  { background: #6a1b9a; }

.chip-cat { font-weight: 700; }
.chip-cat-school { background: #e3f2fd; color: #1565c0; }
.chip-cat-manage { background: #fff3e0; color: #e65100; }
.chip-cat-home   { background: #e8f5e9; color: #2e7d32; }
.chip-cat-other  { background: #f3e5f5; color: #6a1b9a; }
</style>
</head>
<body>

<!-- 상단바 -->
<div class="topbar">
    <div class="topbar-title">
        <svg width="22" height="22" viewBox="0 0 24 24" style="vertical-align:-4px;margin-right:6px"><circle cx="12" cy="12" r="4" fill="#fff176"/><g stroke="white" stroke-width="2" stroke-linecap="round"><line x1="12" y1="2" x2="12" y2="5"/><line x1="12" y1="19" x2="12" y2="22"/><line x1="2" y1="12" x2="5" y2="12"/><line x1="19" y1="12" x2="22" y2="12"/><line x1="4.93" y1="4.93" x2="7.05" y2="7.05"/><line x1="16.95" y1="16.95" x2="19.07" y2="19.07"/><line x1="19.07" y1="4.93" x2="16.95" y2="7.05"/><line x1="7.05" y1="16.95" x2="4.93" y2="19.07"/></g></svg>일일계획
    </div>
    <button class="btn-notif" id="btn-brief" title="오늘 브리핑"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg></button>

</div>

<!-- 날짜 네비 -->
<div class="date-nav">

        <div class="date-weekday" id="date-weekday"></div>
        <div class="date-main">
            <span id="date-main-text"></span>
            <span class="today-chip" id="today-chip" style="display:none">오늘</span>
        </div>

    <button class="nav-btn" id="btn-next">&#8250;</button>
    <button class="btn-today" id="btn-today" style="display:none">오늘로</button>
</div>

<!-- 진행률 -->
<div class="progress-bar-wrap" id="progress-wrap">
    <div class="progress-bar-track"><div class="progress-bar-fill" id="progress-fill"></div></div>
    <div class="progress-text" id="progress-text"></div>
</div>

<!-- 카테고리 필터 탭 -->
<div class="cat-tabs" id="cat-tabs">
    <button class="cat-tab active" data-cat="all"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg> 전체</button>

    <button class="cat-tab" data-cat="manage"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg> 관리</button>
    <button class="cat-tab" data-cat="home"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9,22 9,12 15,12 15,22"/></svg> 집</button>

</div>

<!-- 태스크 목록 -->
<div class="scroll-area" id="task-area"></div>

<!-- 하단 입력창 -->
<div class="bottom-bar">
    <div class="add-row">
        <input class="add-input" id="add-input" type="search" placeholder="할 일 입력…" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
        <button class="btn-mic" id="btn-mic" title="음성 입력"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 1 3 3v7a3 3 0 0 1-6 0V5a3 3 0 0 1 3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="22"/></svg></button>
        <button class="btn-add-text" id="btn-add" title="추가"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></button>
    </div>
    <div class="options-row">
        <span class="opt-label">시간</span>
        <input class="opt-input" id="opt-time" type="time">
        <span class="opt-label">분류</span>
        <select class="opt-input" id="opt-cat">
            <option value="other">기타</option>
            <option value="school">학교</option>
            <option value="manage">관리</option>
            <option value="home">집</option>
        </select>
        <span class="opt-label">우선</span>
        <select class="opt-input" id="opt-prio">
            <option value="normal">보통</option>
            <option value="high">높음</option>
            <option value="low">낮음</option>
        </select>
        <span class="opt-label">알람</span>
        <select class="opt-input" id="opt-alarm">
            <option value="">없음</option>
            <option value="4h">4시간 전</option>
            <option value="1d">하루 전</option>
            <option value="both">둘 다</option>
        </select>
    </div>

<!-- 음성 오버레이 -->
<div class="voice-overlay" id="voice-overlay">
    <div class="voice-circle"><svg width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 1 3 3v7a3 3 0 0 1-6 0V5a3 3 0 0 1 3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="22"/></svg></div>
    <div class="voice-text">말씀해 주세요</div>
    <div class="voice-result" id="voice-result">할 일 추가 또는 "오늘 할일 알려줘"</div>
    <button class="btn-voice-cancel" id="btn-voice-cancel">취소</button>
</div>

<!-- 토스트 -->
<div class="toast" id="toast"></div>

<script>
// ── 상수 ────────────────────────────────────────────────────
const PRIO_LABEL = { high: '높음', normal: '보통', low: '낮음' };
const PRIO_DOT = {
    high: `<svg width="8" height="8" viewBox="0 0 8 8"><circle cx="4" cy="4" r="4" fill="#d93025"/></svg>`,

    low: `<svg width="8" height="8" viewBox="0 0 8 8"><circle cx="4" cy="4" r="4" fill="#80868b"/></svg>`
};
const PRIO_CHIP  = { high: 'chip-prio-high', normal: 'chip-prio-normal', low: 'chip-prio-low' };
const KR_NUMS = { 한:1,두:2,세:3,네:4,다섯:5,여섯:6,일곱:7,여덟:8,아홉:9,열:10,열한:11,열두:12 };
const CATS = {
    school: { label:'학교', chipClass:'chip-cat-school', color:'#1565c0', bg:'#e3f2fd',
        icon:`<svg width="24" height="24" viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20" fill="none" stroke="#1565c0" stroke-width="2" stroke-linecap="round"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z" fill="#bbdefb" stroke="#1565c0" stroke-width="1.8"/><line x1="8" y1="7" x2="16" y2="7" stroke="#1565c0" stroke-width="1.5" stroke-linecap="round"/><line x1="8" y1="11" x2="16" y2="11" stroke="#1565c0" stroke-width="1.5" stroke-linecap="round"/></svg>` },
    manage: { label:'관리', chipClass:'chip-cat-manage', color:'#e65100', bg:'#fff3e0',
        icon:`<svg width="24" height="24" viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" fill="#ffe0b2" stroke="#e65100" stroke-width="1.8" stroke-linejoin="round"/><rect x="9" y="13" width="6" height="8" rx="1" fill="#ffcc80" stroke="#e65100" stroke-width="1.5"/><rect x="5" y="11" width="3" height="3" rx="0.5" fill="#e65100" opacity="0.5"/><rect x="16" y="11" width="3" height="3" rx="0.5" fill="#e65100" opacity="0.5"/></svg>` },
    home:   { label:'집',   chipClass:'chip-cat-home',   color:'#2e7d32', bg:'#e8f5e9',
        icon:`<svg width="24" height="24" viewBox="0 0 24 24"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.8" stroke-linejoin="round"/><polyline points="9,22 9,12 15,12 15,22" fill="#a5d6a7" stroke="#2e7d32" stroke-width="1.5"/></svg>` },
    other:  { label:'기타', chipClass:'chip-cat-other',  color:'#6a1b9a', bg:'#f3e5f5',
        icon:`<svg width="24" height="24" viewBox="0 0 24 24"><polygon points="12,2 15.09,8.26 22,9.27 17,14.14 18.18,21.02 12,17.77 5.82,21.02 7,14.14 2,9.27 8.91,8.26" fill="#ce93d8" stroke="#6a1b9a" stroke-width="1.5" stroke-linejoin="round"/></svg>` }
};

// ── 상태 ────────────────────────────────────────────────────
let curDate = new Date(); curDate.setHours(0,0,0,0);
let curCatFilter = 'all';

function dateKey(d) {
    return `${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}`;
}
function p2(n) { return String(n).padStart(2,'0'); }
function todayMidnight() { const d = new Date(); d.setHours(0,0,0,0); return d; }

// ── 저장 ────────────────────────────────────────────────────
function loadPlan(key) {
    try { return JSON.parse(localStorage.getItem('dp2_' + key) || '{"tasks":[]}'); }
    catch { return {tasks:[]}; }
}
function savePlan(key, plan) {
    localStorage.setItem('dp2_' + key, JSON.stringify(plan));
    rescheduleAllAlarms();
}
function genId() { return Date.now().toString(36) + Math.random().toString(36).slice(2,6); }

// ── 음성 여러 할일 분리 ──────────────────────────────────────
function parseVoiceMulti(text) {
    // 접속사 + 동사 연결어("먹고", "하고", "마치고" 등) 로 분리
    const parts = text.split(/,\s*|그리고\s*|\s+이랑\s+|\s+랑\s+|\s+또\s+|그다음에?\s*|(?:하고|먹고|마시고|마치고|끝내고|끝나고|자고|일어나고|씻고|듣고|읽고|쓰고|가고|오고|만나고|보고|다니고|운동하고|공부하고|청소하고|요리하고|빨래하고|샤워하고)\s*/);
    const segments = parts.map(s => s.trim()).filter(s => s.length > 1);
    return segments.length > 0 ? segments.map(parseVoice) : [parseVoice(text)];
}

// ── 음성 파싱 ────────────────────────────────────────────────
function parseVoice(text) {
    let title = text;
    let dateOffset = 0; // 0=오늘, 1=내일, 2=모레
    let hour = null, minute = 0;

    // 날짜
    if (/모레/.test(text)) { dateOffset = 2; title = title.replace(/모레\s?/,''); }
    else if (/내일/.test(text)) { dateOffset = 1; title = title.replace(/내일\s?/,''); }
    else if (/오늘/.test(text)) { title = title.replace(/오늘\s?/,''); }

    // 오전/오후
    const pm = /오후/.test(title);
    const am = /오전/.test(title);
    title = title.replace(/(오전|오후)\s?/,'');

    // 시간 (숫자 + '시')
    const numMatch = title.match(/(\d{1,2})시\s?(\d{1,2}분?)?/);
    if (numMatch) {
        hour = parseInt(numMatch[1]);
        if (numMatch[2]) minute = parseInt(numMatch[2]);
        if (pm && hour < 12) hour += 12;
        if (am && hour === 12) hour = 0;
        title = title.replace(numMatch[0], '').trim();
    } else {
        // 한글 숫자
        for (const [k,v] of Object.entries(KR_NUMS)) {
            const re = new RegExp(k + '시');
            if (re.test(title)) {
                hour = pm && v < 12 ? v + 12 : v;
                title = title.replace(re,'').trim();
                break;
            }
        }
        // 특수 시간대
        if (/아침/.test(title)) { hour = 8; title = title.replace(/아침\s?/,''); }
        else if (/점심/.test(title)) { hour = 12; title = title.replace(/점심\s?/,''); }
        else if (/저녁/.test(title)) { hour = 18; title = title.replace(/저녁\s?/,''); }
        else if (/밤/.test(title)) { hour = 21; title = title.replace(/밤\s?/,''); }
    }

    const taskDate = new Date(todayMidnight());
    taskDate.setDate(taskDate.getDate() + dateOffset);

    // 우선순위 감지
    let priority = '';
    if (/중요|급해|급한|긴급|빨리/.test(title)) {
        priority = 'high';
        title = title.replace(/중요\s?|급해\s?|급한\s?|긴급\s?|빨리\s?/g, '').trim();
    } else if (/나중에|여유로|여유/.test(title)) {
        priority = 'low';
        title = title.replace(/나중에\s?|여유로\s?|여유\s?/g, '').trim();
    }

    // 카테고리 감지: 명시적 탭 언급 → 키워드 순
    let category = '';
    if (/학교\s?탭/.test(title))      { category = 'school'; title = title.replace(/학교\s?탭\s?/,''); }
    else if (/관리\s?탭/.test(title)) { category = 'manage'; title = title.replace(/관리\s?탭\s?/,''); }
    else if (/집\s?탭/.test(title))   { category = 'home';   title = title.replace(/집\s?탭\s?/,''); }
    else if (/기타\s?탭/.test(title)) { category = 'other';  title = title.replace(/기타\s?탭\s?/,''); }
    else if (/학교|수업|과제|강의|시험|공부|상담센터|도서관|교수|학점/.test(title)) category = 'school';
    else if (/건물|관리비|임대|수리|점검|계약|청구서|행정|처리|업무/.test(title))  category = 'manage';
    else if (/집안일|청소|요리|장보기|빨래|설거지|정리|냉장고/.test(title))        category = 'home';

    const time = hour !== null ? `${p2(hour)}:${p2(minute)}` : '';
    return { title: title.trim() || text, date: dateKey(taskDate), time, category, priority };
}

// ── 렌더 ────────────────────────────────────────────────────
function render() {
    const key = dateKey(curDate);
    const plan = loadPlan(key);
    const tasks = plan.tasks || [];

    const today = todayMidnight();
    const isToday = dateKey(curDate) === dateKey(today);

    // 날짜
    document.getElementById('date-weekday').textContent =
        curDate.toLocaleDateString('ko-KR', { year:'numeric', month:'long', day:'numeric' });
    document.getElementById('date-main-text').textContent =
        curDate.toLocaleDateString('ko-KR', { weekday:'long' });
    document.getElementById('today-chip').style.display = isToday ? '' : 'none';
    document.getElementById('btn-today').style.display = isToday ? 'none' : '';

    // 진행률 (전체 기준)
    const allActive = tasks.filter(t => !t.done);
    const allDone   = tasks.filter(t => t.done);

    // 카테고리 필터
    const filtered = curCatFilter === 'all' ? tasks : tasks.filter(t => (t.category||'other') === curCatFilter);
    const active = filtered.filter(t => !t.done);
    const done   = filtered.filter(t => t.done);
    const pw = document.getElementById('progress-wrap');
    if (tasks.length > 0) {
        pw.style.display = '';
        const pct = Math.round(allDone.length / tasks.length * 100);
        document.getElementById('progress-fill').style.width = pct + '%';
        document.getElementById('progress-text').textContent =
            `${allDone.length}/${tasks.length} 완료 · ${pct}%`;
    } else {
        pw.style.display = 'none';
    }

    // 태스크 목록
    const area = document.getElementById('task-area');
    if (tasks.length === 0) {
        area.innerHTML = `
            <div class="empty-state">
                <div class="empty-icon"><svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="#dadce0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2v4"/><path d="M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/><path d="m9 16 2 2 4-4"/></svg></div>
                <div class="empty-text">오늘의 할 일을 추가하거나<br>음성으로 말해보세요</div>
            </div>`;
        return;
    }

    area.innerHTML =
        (active.length ? active.map(t => taskHTML(t)).join('') : '') +
        (done.length ? `
            <div class="done-header" id="done-hdr">
                <span class="done-arrow" id="done-arrow"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg></span>
                완료 ${done.length}개
            </div>
            <div class="done-list" id="done-list">
                ${done.map(t => taskHTML(t)).join('')}
            </div>` : '');

    bindEvents(plan, key);
}

function taskHTML(t) {
    const timeChip = t.time
        ? `<span class="meta-chip chip-time"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg> ${t.time}</span>` : '';
    const alarmChip = t.alarm && t.alarm !== 'none'
        ? `<span class="meta-chip chip-alarm"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg> ${t.alarm === '4h' ? '4시간 전' : t.alarm === '1d' ? '하루 전' : '4시간/하루 전'}</span>` : '';
    const prioChip = t.priority && t.priority !== 'normal'
        ? `<span class="meta-chip ${PRIO_CHIP[t.priority]}">${PRIO_DOT[t.priority]} ${PRIO_LABEL[t.priority]}</span>` : '';
    const catKey = t.category || 'other';
    const catInfo = CATS[catKey] || CATS.other;

    return `
    <div class="task-card${t.done ? ' done' : ''}" data-tid="${t.id}" style="--cc:${catInfo.color};--cb:${catInfo.bg}">
        <div class="cat-icon-wrap">${catInfo.icon}</div>
        <button class="check-btn${t.done ? ' checked' : ''}" data-tid="${t.id}">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
                ${t.done ? '<path d="M20 6 9 17l-5-5"/>' : ''}
            </svg>
        </button>
        <div class="task-body">
            <input class="task-title-inp" value="${esc(t.title)}" data-tid="${t.id}" ${t.done ? 'disabled' : ''}>
            <div class="task-meta">${timeChip}${alarmChip}${prioChip}</div>
        </div>
        <button class="btn-del-task" data-tid="${t.id}" title="삭제"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    </div>`;
}

function esc(s) {
    return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function bindEvents(plan, key) {
    // 완료 체크
    document.querySelectorAll('.check-btn').forEach(btn => {
        btn.onclick = () => {
            const t = plan.tasks.find(x => x.id === btn.dataset.tid);
            if (t) { t.done = !t.done; savePlan(key, plan); render(); }
        };
    });
    // 삭제
    document.querySelectorAll('.btn-del-task').forEach(btn => {
        btn.onclick = () => {
            plan.tasks = plan.tasks.filter(x => x.id !== btn.dataset.tid);
            savePlan(key, plan); render();
        };
    });
    // 제목 수정
    document.querySelectorAll('.task-title-inp').forEach(inp => {
        let tm;
        inp.addEventListener('input', () => {
            clearTimeout(tm);
            tm = setTimeout(() => {
                const t = plan.tasks.find(x => x.id === inp.dataset.tid);
                if (t) { t.title = inp.value; savePlan(key, plan); }
            }, 600);
        });
    });
    // 길게 눌러서 삭제 버튼 표시
    document.querySelectorAll('.task-card').forEach(card => {
        let lt;
        card.addEventListener('pointerdown', () => {
            lt = setTimeout(() => card.classList.toggle('show-del'), 500);
        });
        card.addEventListener('pointerup', () => clearTimeout(lt));
        card.addEventListener('pointercancel', () => clearTimeout(lt));
    });
    // 완료 접기
    const doneHdr = document.getElementById('done-hdr');
    if (doneHdr) {
        doneHdr.onclick = () => {
            const list = document.getElementById('done-list');
            const arrow = document.getElementById('done-arrow');
            list.classList.toggle('open');
            arrow.classList.toggle('open');
        };
    }
}

// ── 태스크 추가 ────────────────────────────────────────────
function addTask(title, dateStr, time, prio, alarm, category) {
    if (!title.trim()) return;
    const key = dateStr || dateKey(curDate);
    const plan = loadPlan(key);
    plan.tasks.push({ id: genId(), title: title.trim(), time: time||'', priority: prio||'normal', alarm: alarm||'', category: category||'other', done: false, createdAt: Date.now() });

    // 날짜 기준 정렬: 시간 있는 것 먼저, 그 다음 우선순위 순
    plan.tasks.sort((a,b) => {
        if (a.done !== b.done) return a.done ? 1 : -1;
        if (a.time && b.time) return a.time < b.time ? -1 : 1;
        if (a.time) return -1; if (b.time) return 1;
        const po = {high:0, normal:1, low:2};
        return (po[a.priority]||1) - (po[b.priority]||1);
    });

    savePlan(key, plan);
    // 추가한 날짜가 현재 보는 날짜면 바로 렌더
    if (key === dateKey(curDate)) render();
    showToast(dateStr && dateStr !== dateKey(curDate)
        ? `"${title.trim()}" → ${dateStr} 추가됨` : `"${title.trim()}" 추가됨`);
}

// ── 알람 스케줄 ────────────────────────────────────────────
let sw = null;

async function initSW() {
    if (!('serviceWorker' in navigator)) return;
    try {
        const reg = await navigator.serviceWorker.register('./sw.js');
        await navigator.serviceWorker.ready;
        sw = reg.active || reg.waiting || reg.installing;
        navigator.serviceWorker.addEventListener('controllerchange', () => {
            sw = navigator.serviceWorker.controller;
        });
        rescheduleAllAlarms();
    } catch(e) { console.warn('SW 등록 실패', e); }
}

function rescheduleAllAlarms() {
    if (!sw) { sw = navigator.serviceWorker?.controller; }
    if (!sw) return;

    const now = Date.now();
    // 오늘 + 내일 + 모레 계획만 체크
    for (let i = -1; i <= 7; i++) {
        const d = new Date(todayMidnight());
        d.setDate(d.getDate() + i);
        const key = dateKey(d);
        const plan = loadPlan(key);
        (plan.tasks || []).forEach(t => {
            if (!t.time || !t.alarm || t.alarm === 'none' || t.done) return;
            const [hh, mm] = t.time.split(':').map(Number);
            const taskMs = new Date(key + 'T' + p2(hh) + ':' + p2(mm) + ':00').getTime();

            const schedules = [];
            if (t.alarm === '4h' || t.alarm === 'both') schedules.push({ id: t.id+'_4h', offset: 4*60*60*1000, label:'4시간 후' });
            if (t.alarm === '1d' || t.alarm === 'both') schedules.push({ id: t.id+'_1d', offset: 24*60*60*1000, label:'내일' });

            schedules.forEach(({id, offset, label}) => {
                const fireAt = taskMs - offset;
                const delay  = fireAt - now;
                if (delay > 0 && delay < 7 * 24 * 60 * 60 * 1000) {
                    sw.postMessage({
                        type: 'SCHEDULE',
                        id,
                        title: '일일계획 알림 🔔',
                        body: `[${label}] ${t.time} ${t.title}`,
                        delay
                    });
                }
            });
        });
    }
}

// ── 브리핑 ────────────────────────────────────────────────────
function isQuery(text) {
    return /알려줘|알려주세요|뭐야|뭐지|뭐가 있어|뭐 있어|브리핑|읽어줘/.test(text);
}

function parseQueryScope(text) {
    if (/이번\s?주|이번주/.test(text))   return 'week';
    if (/다음\s?주|다음주/.test(text))   return 'nextweek';
    if (/모레/.test(text))               return 'dayafter';
    if (/내일/.test(text))               return 'tomorrow';
    if (/오전/.test(text))               return 'morning';
    if (/오후/.test(text))               return 'afternoon';
    return 'today';
}

function briefTasks(scope) {
    const today = todayMidnight();
    let tasks = [], scopeLabel = '';

    if (scope === 'week' || scope === 'nextweek') {
        const startOffset = scope === 'nextweek' ? 7 : 0;
        scopeLabel = scope === 'nextweek' ? '다음 주' : '이번 주';
        for (let i = startOffset; i < startOffset + 7; i++) {
            const d = new Date(today); d.setDate(d.getDate() + i);
            (loadPlan(dateKey(d)).tasks || []).filter(t => !t.done).forEach(t => tasks.push({ ...t, _day: d.toLocaleDateString('ko-KR', { weekday:'short', month:'short', day:'numeric' }) }));
        }
    } else if (scope === 'tomorrow') {
        const d = new Date(today); d.setDate(d.getDate() + 1);
        scopeLabel = '내일';
        tasks = (loadPlan(dateKey(d)).tasks || []).filter(t => !t.done);
    } else if (scope === 'dayafter') {
        const d = new Date(today); d.setDate(d.getDate() + 2);
        scopeLabel = '모레';
        tasks = (loadPlan(dateKey(d)).tasks || []).filter(t => !t.done);
    } else if (scope === 'morning') {
        scopeLabel = '오늘 오전';
        tasks = (loadPlan(dateKey(today)).tasks || []).filter(t => !t.done && t.time && parseInt(t.time) < 12);
    } else if (scope === 'afternoon') {
        scopeLabel = '오늘 오후';
        tasks = (loadPlan(dateKey(today)).tasks || []).filter(t => !t.done && t.time && parseInt(t.time) >= 12);
    } else {
        scopeLabel = '오늘';
        tasks = (loadPlan(dateKey(today)).tasks || []).filter(t => !t.done);
    }

    function timeToSpeech(t) {
        if (!t) return '';
        const [h, m] = t.split(':').map(Number);
        const ap = h < 12 ? '오전' : '오후';
        const hr = h === 0 ? 12 : h > 12 ? h - 12 : h;
        const mn = m === 0 ? '' : m === 30 ? ' 반' : ` ${m}분`;
        return `${ap} ${hr}시${mn}에 `;
    }
    const KR_N = ['','한','두','세','네','다섯','여섯','일곱','여덟','아홉','열'];
    function cntWord(n) { return (n <= 10 ? KR_N[n] : n) + '가지'; }

    let speech = '';
    if (tasks.length === 0) {
        speech = `${scopeLabel}에는 할 일이 없어요. 여유롭게 쉬세요.`;
    } else {
        speech = `${scopeLabel} 할 일은 ${cntWord(tasks.length)}예요. `;
        tasks.forEach((t, i) => {
            const connector = i === 0 ? '' : i === tasks.length - 1 ? '마지막으로 ' : '그리고 ';
            speech += connector;
            if (t._day) speech += `${t._day} `;
            speech += timeToSpeech(t.time);
            speech += t.title + '. ';
        });
    }

    window.speechSynthesis.cancel();
    const utter = new SpeechSynthesisUtterance(speech);
    utter.lang = 'ko-KR';
    utter.rate = 0.88;
    utter.pitch = 1.05;
    window.speechSynthesis.speak(utter);
    showToast(`${scopeLabel} 브리핑 시작`);
}

// ── 알림 권한 ────────────────────────────────────────────────
async function requestNotifPerm() {
    if (!('Notification' in window)) { showToast('이 브라우저는 알림을 지원하지 않아요'); return; }
    const perm = await Notification.requestPermission();
    if (perm === 'granted') {
        showToast('알림이 허용됐어요');
        updateNotifBtn();
        rescheduleAllAlarms();
    } else {
        showToast('알림이 차단됐어요. 설정에서 허용해 주세요');
    }
}

// ── 음성 인식 ────────────────────────────────────────────────
let recognition = null;
let isListening = false;
let voiceFinal = '';
let voiceSilenceTimer = null;

function initVoice() {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) return;
    recognition = new SR();
    recognition.lang = 'ko-KR';
    recognition.continuous = true;   // 쉬어도 계속 듣기
    recognition.interimResults = true;

    recognition.onresult = e => {
        if (!isListening) return; // stop() 후 마지막 result 이벤트 무시
        let interim = '';
        for (let i = e.resultIndex; i < e.results.length; i++) {
            if (e.results[i].isFinal) {
                voiceFinal += (voiceFinal ? ' ' : '') + e.results[i][0].transcript;
            } else {
                interim += e.results[i][0].transcript;
            }
        }
        const display = voiceFinal + (interim ? (voiceFinal ? ' ' : '') + interim : '');
        document.getElementById('voice-result').textContent = display || '듣는 중…';

        // 2.5초 침묵하면 자동 완료
        clearTimeout(voiceSilenceTimer);
        voiceSilenceTimer = setTimeout(() => {
            const full = display.trim();
            stopListening();
            if (full) handleVoiceResult(full);
        }, 2500);
    };

    recognition.onerror = e => { if (e.error !== 'no-speech') stopListening(); };
    // continuous 모드에서 중간에 끊기면 재시작
    recognition.onend = () => { if (isListening) { try { recognition.start(); } catch(_) {} } };
}

function handleVoiceResult(transcript) {
    const prio  = document.getElementById('opt-prio').value;
    const alarm = document.getElementById('opt-alarm').value;
    const cat   = document.getElementById('opt-cat').value;

    if (isQuery(transcript)) { briefTasks(parseQueryScope(transcript)); return; }

    const parsedList = parseVoiceMulti(transcript);
    if (parsedList.length > 1) {
        parsedList.forEach(p => addTask(p.title, p.date, p.time, p.priority || prio, alarm, p.category || cat));
        showToast(`${parsedList.length}개 할일 추가됨`);
    } else {
        const parsed = parsedList[0];
        document.getElementById('add-input').value = parsed.title;
        if (parsed.time)     document.getElementById('opt-time').value = parsed.time;
        if (parsed.category) document.getElementById('opt-cat').value  = parsed.category;
        if (parsed.priority) document.getElementById('opt-prio').value = parsed.priority;
        if (parsed.date !== dateKey(curDate)) {
            addTask(parsed.title, parsed.date, parsed.time, parsed.priority || prio, alarm, parsed.category || cat);
            document.getElementById('add-input').value = '';
        } else {
            document.getElementById('add-input').focus();
        }
    }
}

function startListening() {
    if (!recognition) { showToast('음성 인식을 지원하지 않는 브라우저예요'); return; }
    voiceFinal = '';
    clearTimeout(voiceSilenceTimer);
    isListening = true;
    document.getElementById('voice-overlay').classList.add('active');
    document.getElementById('voice-result').textContent = '할 일 추가 또는 "오늘 할일 알려줘"';
    document.getElementById('btn-mic').classList.add('listening');
    try { recognition.start(); } catch(e) { stopListening(); }
}

function stopListening() {
    clearTimeout(voiceSilenceTimer);
    isListening = false;
    document.getElementById('voice-overlay').classList.remove('active');
    document.getElementById('btn-mic').classList.remove('listening');
    try { recognition.stop(); } catch(e) {}
}

// ── 토스트 ────────────────────────────────────────────────
let toastTimer;
function showToast(msg) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), 2500);
}

// ── 이벤트 ────────────────────────────────────────────────
document.getElementById('btn-prev').onclick = () => { curDate.setDate(curDate.getDate()-1); render(); };
document.getElementById('btn-next').onclick = () => { curDate.setDate(curDate.getDate()+1); render(); };
document.getElementById('btn-today').onclick = () => { curDate = todayMidnight(); render(); };
document.getElementById('btn-notif-perm').onclick = requestNotifPerm;
document.getElementById('btn-brief').onclick = () => briefTasks('today');
document.getElementById('btn-mic').onclick = () => isListening ? stopListening() : startListening();
document.getElementById('btn-voice-cancel').onclick = stopListening;

document.getElementById('btn-add').onclick = () => {
    const title = document.getElementById('add-input').value.trim();
    if (!title) return;
    addTask(title, null,
        document.getElementById('opt-time').value,
        document.getElementById('opt-prio').value,
        document.getElementById('opt-alarm').value,
        document.getElementById('opt-cat').value);
    document.getElementById('add-input').value = '';
    document.getElementById('opt-time').value = '';
    document.getElementById('opt-prio').value = 'normal';
    document.getElementById('opt-alarm').value = '';
    document.getElementById('opt-cat').value = 'other';
};

document.getElementById('add-input').addEventListener('keydown', e => {
    if (e.key === 'Enter') document.getElementById('btn-add').click();
});

document.getElementById('cat-tabs').addEventListener('click', e => {
    const tab = e.target.closest('.cat-tab');
    if (!tab) return;
    curCatFilter = tab.dataset.cat;
    document.querySelectorAll('.cat-tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    render();
});

// ── 알림 상태 표시 ────────────────────────────────────────
function updateNotifBtn() {
    const btn = document.getElementById('btn-notif-perm');
    if (!('Notification' in window)) { btn.style.display = 'none'; return; }
    if (Notification.permission === 'granted') {
        btn.innerHTML = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>`;
        btn.title = '알림 켜짐';
    } else {
        btn.innerHTML = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8.7 3A6 6 0 0 1 18 8a21.3 21.3 0 0 0 .6 5"/><path d="M17 17H3s3-2 3-9a4.67 4.67 0 0 1 .3-1.7"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/><line x1="2" y1="2" x2="22" y2="22"/></svg>`;
        btn.title = '알림 허용 (탭)';
    }
}

// ── 초기화 ────────────────────────────────────────────────
initVoice();
initSW();
updateNotifBtn();
render();
</script>
